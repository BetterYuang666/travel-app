function renderSpotGuide() {
  const trip = getActiveTrip();
  const container = document.getElementById('spot-content');
  if (!trip) {
    container.innerHTML = `
      <div class="no-trip-selected">
        <div class="icon">📖</div><h3>请先选择行程</h3>
        <p>回到首页选择或创建一个旅行计划</p>
        <button class="btn btn-primary mt-16" onclick="switchTab('home')">去首页</button>
      </div>`;
    return;
  }

  // Collect ALL activities with location names (with and without stories)
  const spotsWithStories = [];
  const spotsWithoutStories = [];
  trip.days.forEach(day => {
    day.activities.forEach(a => {
      const locName = a.location?.name || a.title;
      if (a.spotStory && a.spotStory.trim()) {
        spotsWithStories.push({ ...a, dayNum: day.dayNumber });
      } else if (locName && (a.type === 'sightseeing' || a.type === 'food')) {
        spotsWithoutStories.push({ ...a, dayNum: day.dayNumber });
      }
    });
  });

  // Trip selector
  const data = loadData();
  let html = `<div class="trip-selector">
    <select onchange="selectTripForSpot(this.value)">`;
  data.trips.forEach(t => {
    html += `<option value="${t.id}" ${t.id === trip.id ? 'selected' : ''}>${t.name}</option>`;
  });
  html += `</select></div>`;

  html += `
    <div class="spot-header">
      <h2>📖 景点百科</h2>
      <p>边走边读 / 了解每个地方的故事</p>
    </div>`;

  // Batch generate button
  const config = getAIConfig();
  if (spotsWithoutStories.length > 0) {
    html += `<div style="text-align:center;margin-bottom:16px">
      <button class="btn btn-outline btn-sm" id="batch-gen-btn" onclick="batchGenerateStories()">
        🤖 AI一键生成 ${spotsWithoutStories.length} 个景点故事
      </button>`;
    if (!config.apiKey) {
      html += `<div style="font-size:11px;color:#999;margin-top:6px">💡 需先在首页 <a href="javascript:void(0)" onclick="switchTab('home');setTimeout(showAISettings,300)">配置免费AI密钥</a></div>`;
    }
    html += `</div>`;
  }

  if (spotsWithStories.length === 0 && spotsWithoutStories.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-icon">📚</div>
      <h3>暂无景点百科</h3>
      <p>在行程活动中添加景点或美食"类型"的活动<br>即可使用AI自动生成百科故事</p>
    </div>`;
  } else if (spotsWithStories.length === 0) {
    html += `<div class="empty-state">
      <div class="empty-icon">🤖</div>
      <h3>${spotsWithoutStories.length} 个景点待生成</h3>
      <p>点击上方按钮一键生成全部景点故事</p>
    </div>`;
  } else {
    spotsWithStories.forEach((s, i) => {
      html += `
        <div class="spot-card s-d${s.dayNum % 5}">
          <span class="spot-tag">D${s.dayNum} ${TYPE_LABELS[s.type]||s.type}</span>
          <div class="spot-title">${escHtml(s.title)}</div>
          <div class="spot-subtitle">📍 ${s.location ? escHtml(s.location.name) : '未知地点'}</div>
          <div class="spot-story">${formatStory(s.spotStory)}</div>
        </div>`;
    });
    if (spotsWithoutStories.length > 0) {
      html += `<div style="text-align:center;margin-top:8px;font-size:12px;color:#999">还有 ${spotsWithoutStories.length} 个景点可生成故事</div>`;
    }
  }

  container.innerHTML = html;
}

function selectTripForSpot(id) {
  const data = loadData();
  data.activeTripId = id;
  saveData(data);
  renderSpotGuide();
}

async function batchGenerateStories() {
  const config = getAIConfig();
  if (!config.apiKey) {
    if (confirm('请先配置豆包AI密钥（免费）。是否现在去设置？')) {
      showAISettings();
    }
    return;
  }

  const trip = getActiveTrip();
  if (!trip) return;

  // Collect activities needing stories
  const needStories = [];
  trip.days.forEach(day => {
    day.activities.forEach(a => {
      const locName = a.location?.name || a.title;
      if (!a.spotStory && locName && (a.type === 'sightseeing' || a.type === 'food')) {
        needStories.push({ act: a, dayNum: day.dayNumber, locName });
      }
    });
  });

  if (needStories.length === 0) { alert('没有需要生成故事的景点'); return; }

  const btn = document.getElementById('batch-gen-btn');
  const total = needStories.length;
  let completed = 0;

  if (btn) { btn.disabled = true; btn.innerHTML = `⏳ 生成中 0/${total}...`; }

  for (const item of needStories) {
    try {
      const prompt = `请为景点「${item.locName}」写一段精炼有趣的旅行故事（120字以内，用口语化语言）：

要求：
1. 点出最有意思的历史背景或民间传说（1-2句即可）
2. 语言活泼，像朋友聊天，避免教科书腔
3. 有相关名人轶事或诗句只提最精彩的一句
4. 结尾可以加一句实用小贴士（如最佳观赏时间）

直接输出故事文字，不要加标题、前缀或引号。`;

      const resp = await fetch('https://ark.cn-beijing.volces.com/api/v3/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${config.apiKey}`
        },
        body: JSON.stringify({
          model: config.model || 'doubao-lite-128k',
          messages: [
            { role: 'system', content: '你是一个专业的旅行导游，擅长用简洁生动的语言介绍景点。' },
            { role: 'user', content: prompt }
          ],
          max_tokens: 500,
          temperature: 0.7
        })
      });

      if (resp.ok) {
        const data = await resp.json();
        const story = data.choices?.[0]?.message?.content?.trim() || '';
        if (story) {
          item.act.spotStory = story;
          completed++;
        }
      }
      // Small delay between requests to avoid rate limiting
      await new Promise(r => setTimeout(r, 600));
    } catch(e) {
      console.warn('Batch generate failed for:', item.locName, e);
    }
    if (btn) btn.innerHTML = `⏳ 生成中 ${completed}/${total}...`;
  }

  // Save to localStorage
  const appData = loadData();
  const tIdx = appData.trips.findIndex(t => t.id === trip.id);
  if (tIdx >= 0) appData.trips[tIdx] = trip;
  saveData(appData);

  if (btn) { btn.disabled = false; btn.innerHTML = `✅ 已完成 ${completed}/${total}`; }
  renderSpotGuide();

  if (completed === 0) {
    alert('生成失败，请检查API密钥是否正确。');
  }
}

function formatStory(text) {
  if (!text) return '';
  // Highlight phrases in quotes
  return escHtml(text).replace(/「([^」]+)」/g, '<span class="highlight">「$1」</span>')
    .replace(/"([^"]+)"/g, '<span class="highlight">"$1"</span>');
}

async function autoGeocode() {

async function geocodeSearch(isAuto) {
  const locName = document.getElementById('af-locname')?.value.trim();
  if (!locName) { if (!isAuto) alert('请先输入地点名称'); return; }

  if (locName === _lastGeocodeQuery) {
    const latVal = document.getElementById('af-lat')?.value.trim();
    if (latVal) return;
  }

  const trip = getActiveTrip();
  const destHint = trip ? ` ${trip.destination}` : '';
  const smartQuery = locName.includes(destHint.trim()) ? locName : `${locName}${destHint}`;

  const btn = document.getElementById('geo-search-btn');
  const hint = document.getElementById('geo-hint');
  if (btn) { btn.classList.add('loading'); btn.innerHTML = '⏳ 搜索中...'; }
  if (hint) hint.textContent = '正在搜索坐标...';

  let found = false;

  // 1. Try Amap (高德) geocoding if key configured - most accurate for China
  const amapKey = getAmapKey();
  if (amapKey) {
    try {
      // Don't restrict by city — the city param causes all results to bias to one city
      // Instead, append destination name to the address query for better context
      const dest = trip ? trip.destination : '';
      const enhancedQuery = dest && !smartQuery.includes(dest) ? `${smartQuery} ${dest}` : smartQuery;
      const amapUrl = `https://restapi.amap.com/v3/geocode/geo?key=${amapKey}&address=${encodeURIComponent(enhancedQuery)}&output=JSON`;
      const resp = await fetchWithTimeout(amapUrl, 8000);
      const data = await resp.json();
      if (data.status === '1' && data.geocodes && data.geocodes.length > 0) {
        const geo = data.geocodes[0];
        const [lngStr, latStr] = geo.location.split(',');
        document.getElementById('af-lat').value = parseFloat(latStr).toFixed(6);
        document.getElementById('af-lng').value = parseFloat(lngStr).toFixed(6);
        _lastGeocodeQuery = locName;
        if (hint) hint.innerHTML = `✅ 高德找到: ${geo.formatted_address || locName}<br><small style="color:#999">如不准确可手动修改</small>`;
        if (btn) { btn.classList.remove('loading'); btn.innerHTML = '🔍 查找坐标'; }
        found = true;
        if (isAuto) suggestAIStory();
      } else if (data.infocode === '10021') {
        if (hint) hint.innerHTML = '⚠️ 高德Key QPS超限，请稍后重试';
      } else if (data.infocode === '30001') {
        if (hint) hint.innerHTML = '⚠️ 高德Key未开通"地理编码"服务<br><small style="color:#999">请到 <a href="https://console.amap.com/dev/key/app" target="_blank">高德控制台</a> 开通"地理编码"API服务</small>';
      } else {
        // Amap returned no results, will fall through to Photon
      }
    } catch(e) { /* Amap failed, try fallback */ }
  }

  // 2. Fallback: Photon API
  if (!found) {
    try {
      const photonUrl = `https://photon.komoot.io/api/?q=${encodeURIComponent(smartQuery + ' 中国')}&limit=3`;
      const resp = await fetchWithTimeout(photonUrl, 8000);
      const data = await resp.json();
      if (data.features && data.features.length > 0) {
        const f = data.features[0];
        const props = f.properties;
        const parts = [props.name, props.city, props.state, props.country].filter(Boolean);
        document.getElementById('af-lat').value = f.geometry.coordinates[1].toFixed(6);
        document.getElementById('af-lng').value = f.geometry.coordinates[0].toFixed(6);
        _lastGeocodeQuery = locName;
        if (hint) hint.innerHTML = `✅ 找到: ${parts.join(', ').substring(0, 80)}<br><small style="color:#999">如不准确可手动修改 &nbsp;|&nbsp; <a href="javascript:void(0)" onclick="closeModal();showAISettings()">配置高德Key获得更准结果</a></small>`;
        if (btn) { btn.classList.remove('loading'); btn.innerHTML = '🔍 查找坐标'; }
        found = true;
        if (isAuto) suggestAIStory();
      }
    } catch(e) { /* Photon failed */ }
  }

  if (!found) {
    const msg = amapKey
      ? '❌ 未找到该地点<br><small style="color:#999">请尝试添加城市名，如"西湖 杭州"<br>或手动输入经纬度（高德地图APP长按地点获取）</small>'
      : '❌ 未找到该地点<br><small style="color:#999">建议：<a href="javascript:void(0)" onclick="closeModal();showAISettings()">配置免费高德Key</a>获得国内精准坐标<br>或手动输入经纬度（高德地图APP长按地点获取）</small>';
    if (hint) hint.innerHTML = msg;
    _lastGeocodeQuery = '';
    if (btn) { btn.classList.remove('loading'); btn.innerHTML = '🔍 查找坐标'; }
  }
}

let _poiCache = null;

async function searchPOIDetail() {
  const card = document.getElementById('poi-info-card');
  const btn = document.getElementById('poi-search-btn');
  if (!card || !btn) return;

  let name = document.getElementById('af-locname')?.value.trim();
  if (!name) name = document.getElementById('af-title')?.value.trim();
  if (!name) { alert('请先填写地点名称或标题'); return; }

  const key = getAmapKey();
  if (!key) {
    card.style.display = 'block';
    card.querySelector('.poi-name').innerHTML = '⚠️ 请先在设置中配置高德Key';
    return;
  }

  btn.classList.add('loading');
  btn.textContent = '⏳ 搜索中...';
  card.style.display = 'none';

  try {
    const trip = getActiveTrip();
    const city = trip?.destination || '';
    const searchUrl = `https://restapi.amap.com/v3/place/text?keywords=${encodeURIComponent(name)}&city=${encodeURIComponent(city)}&key=${key}&extensions=all&offset=1`;
    const resp = await fetchWithTimeout(searchUrl, 10000);
    const data = await resp.json();

    if (data.status === '1' && data.pois && data.pois.length > 0) {
      const poi = data.pois[0];
      if (poi.id) {
        try {
          const detailUrl = `https://restapi.amap.com/v3/place/detail?id=${poi.id}&key=${key}`;
          const detailResp = await fetchWithTimeout(detailUrl, 8000);
          const detailData = await detailResp.json();
          if (detailData.status === '1' && detailData.pois && detailData.pois.length > 0) {
            displayPOIData(detailData.pois[0]);
            return;
          }
        } catch(e) {}
      }
      displayPOIData(poi);
    } else {
      card.style.display = 'block';
      card.querySelector('.poi-name').textContent = `❌ 未找到"${name}"的相关信息`;
    }
  } catch(e) {
    card.style.display = 'block';
    card.querySelector('.poi-name').textContent = '❌ 网络连接失败，请重试';
  } finally {
    btn.classList.remove('loading');
    btn.textContent = '🔎 详情';
  }
}

function displayPOIData(poi) {
  _poiCache = poi;
  const card = document.getElementById('poi-info-card');
  if (!card) return;

  const setVal = (id, val) => {
    const el = document.getElementById(id);
    if (el) el.textContent = val || '--';
  };

  card.querySelector('.poi-name').textContent = poi.name || '未知';
  setVal('poi-type', poi.type || '--');
  setVal('poi-addr', poi.address || '--');

  let rating = '--';
  if (poi.biz_ext?.rating) rating = '⭐ ' + poi.biz_ext.rating;
  else if (poi.deep_info?.rating) rating = '⭐ ' + poi.deep_info.rating;
  setVal('poi-rating', rating);

  let ticket = '--';
  if (poi.deep_info?.price) ticket = '¥' + poi.deep_info.price;
  else if (poi.biz_ext?.cost) ticket = '¥' + poi.biz_ext.cost;
  setVal('poi-ticket', ticket);

  let hours = '--';
  if (poi.biz_ext?.opentime) hours = poi.biz_ext.opentime;
  else if (poi.deep_info?.opentime) hours = poi.deep_info.opentime;
  setVal('poi-hours', hours);

  setVal('poi-phone', poi.tel || (poi.biz_ext && poi.biz_ext.tel) || '--');

  card.style.display = 'block';
}

function autoFillFromPOI() {
  if (!_poiCache) return;
  const poi = _poiCache;
  const locInput = document.getElementById('af-locname');
  const latInput = document.getElementById('af-lat');
  const lngInput = document.getElementById('af-lng');
  const descInput = document.getElementById('af-desc');

  if (locInput && !locInput.value.trim() && poi.name) {
    locInput.value = poi.name;
  }
  if (latInput && lngInput && poi.location) {
    const parts = poi.location.split(',');
    if (parts.length === 2) {
      if (!latInput.value.trim()) latInput.value = parseFloat(parts[1]).toFixed(6);
      if (!lngInput.value.trim()) lngInput.value = parseFloat(parts[0]).toFixed(6);
    }
  }
  if (descInput && !descInput.value.trim()) {
    const parts = [];
    if (poi.address) parts.push('📍 ' + poi.address);
    if (poi.tel) parts.push('📞 ' + poi.tel);
    if (poi.biz_ext && poi.biz_ext.opentime) parts.push('🕐 ' + poi.biz_ext.opentime);
    if (poi.biz_ext && poi.biz_ext.rating) parts.push('⭐ ' + poi.biz_ext.rating + '分');
    if (poi.deep_info && poi.deep_info.price) parts.push('🎫 ¥' + poi.deep_info.price);
    if (parts.length > 0) descInput.value = parts.join('\n');
  }
}

// ROUTE PLANNING (Amap Direction API)
// ============================================================
let _routePolylines = [];
let _routeData = {};

function getTravelMode(fromAct, toAct) {
  // Both sightseeing or food -> likely walking distance
  const bothLocal = ['sightseeing', 'food', 'shopping'].includes(fromAct.type) &&
                    ['sightseeing', 'food', 'shopping'].includes(toAct.type);
  if (bothLocal) return 'walking';
  // Transport type -> driving
  if (fromAct.type === 'transport' || toAct.type === 'transport') return 'driving';
  // If both have coordinates, check distance
  if (fromAct.location && toAct.location &&
      fromAct.location.lat && toAct.location.lat) {
    const dist = Math.sqrt(
      Math.pow((fromAct.location.lat - toAct.location.lat) * 111000, 2) +
      Math.pow((fromAct.location.lng - toAct.location.lng) * 111000 * Math.cos(fromAct.location.lat * Math.PI / 180), 2)
    );
    if (dist < 1000) return 'walking';
    if (dist < 50000) return 'driving';
  }
  return 'transit';
}

async function fetchAndDisplayRoute(dayNum, actIdx, fromId, toId) {
  const routeEl = document.getElementById(`route-${dayNum}-${actIdx}`);
  if (!routeEl) return;
  const btn = routeEl.querySelector('.route-btn');
  const noKey = routeEl.querySelector('.route-no-key');

  const key = getAmapKey();
  if (!key) {
    if (noKey) noKey.style.display = 'inline';
    return;
  }

  const trip = getActiveTrip();
  if (!trip) return;
  const day = trip.days.find(d => d.dayNumber === dayNum);
  if (!day) return;
  const fromAct = day.activities.find(a => a.id === fromId);
  const toAct = day.activities.find(a => a.id === toId);
  if (!fromAct || !toAct) return;
  if (!fromAct.location || !toAct.location) return;

  btn.classList.add('loading');
  btn.textContent = '⏳';

  try {
    const mode = getTravelMode(fromAct, toAct);
    const origin = `${fromAct.location.lng},${fromAct.location.lat}`;
    const destination = `${toAct.location.lng},${toAct.location.lat}`;

    let apiUrl;
    if (mode === 'walking') {
      apiUrl = `https://restapi.amap.com/v3/direction/walking?origin=${origin}&destination=${destination}&key=${key}`;
    } else if (mode === 'driving') {
      apiUrl = `https://restapi.amap.com/v3/direction/driving?origin=${origin}&destination=${destination}&strategy=0&key=${key}`;
    } else {
      const city = trip.destination || '';
      apiUrl = `https://restapi.amap.com/v3/direction/transit/integrated?origin=${origin}&destination=${destination}&city=${encodeURIComponent(city)}&key=${key}`;
    }

    const resp = await fetchWithTimeout(apiUrl, 12000);
    const data = await resp.json();

    if (data.status === '1' && data.route) {
      const route = data.route;
      let distance = 0, duration = 0, polyline = null, modeLabel = '';

      if (route.paths && route.paths.length > 0) {
        const path = route.paths[0];
        distance = parseInt(path.distance) || 0;
        duration = parseInt(path.duration) || 0;
        modeLabel = mode === 'walking' ? '🚶 步行' : mode === 'driving' ? '🚗 驾车' : '🚌 公交';
        // Get polyline steps - Amap returns encoded polyline
        if (mode === 'driving' || mode === 'walking') {
          const steps = path.steps || [];
          let fullPoly = '';
          steps.forEach(s => { if (s.polyline) fullPoly += (fullPoly ? ';' : '') + s.polyline; });
          if (fullPoly) polyline = fullPoly;
        }
      }

      // Update route card DOM
      const distStr = distance >= 1000 ? `${(distance / 1000).toFixed(1)}km` : `${distance}m`;
      const durStr = duration >= 3600
        ? `${Math.floor(duration / 3600)}h${Math.round((duration % 3600) / 60)}min`
        : `${Math.round(duration / 60)}分钟`;

      routeEl.querySelector('.route-mode').textContent = modeLabel;
      routeEl.querySelector('.route-dist').textContent = distStr;
      routeEl.querySelector('.route-time').textContent = durStr;

      // Cache route data
      const cacheKey = `d${dayNum}-${actIdx}`;
      _routeData[cacheKey] = { polyline, mode, distance, duration, dayNum };

      // Draw on map if available
      if (polyline && map) {
        drawRoutePolyline(dayNum, actIdx, polyline, mode);
      }

      btn.textContent = '✅';
      setTimeout(() => { btn.textContent = '查询路线'; }, 2000);
    } else {
      routeEl.querySelector('.route-mode').textContent = '⚠️ 无路线';
      routeEl.querySelector('.route-dist').textContent = '';
      routeEl.querySelector('.route-time').textContent = '';
      btn.textContent = '重试';
    }
  } catch(e) {
    routeEl.querySelector('.route-mode').textContent = '❌ 网络错误';
    btn.textContent = '重试';
  } finally {
    btn.classList.remove('loading');
  }
}

function decodeAmapPolyline(encoded) {
  if (!encoded) return [];
  // Amap polyline uses a compact encoding
  // Split by semicolons (step separators) and decode each step
  const segments = encoded.split(';');
  let allCoords = [];
  let prevLng = 0, prevLat = 0;

  segments.forEach(seg => {
    if (!seg.trim()) return;
    // Each segment is pairs of encoded numbers: lng,lat,lng,lat...
    // Amap encoding: each number is the change from previous, divided by 1e5
    // But the format can vary; also try standard Google polyline as fallback
    const coords = [];
    // Try Amap's format: semicolon-delimited lng,lat pairs
    const parts = seg.split(',');
    for (let i = 0; i < parts.length - 1; i += 2) {
      const lng = parseFloat(parts[i]);
      const lat = parseFloat(parts[i + 1]);
      if (!isNaN(lng) && !isNaN(lat)) {
        coords.push([lat, lng]);
      }
    }
    if (coords.length > 0) {
      allCoords = allCoords.concat(coords);
    }
  });

  // If the above didn't work, try Google encoded polyline format
  if (allCoords.length === 0 && encoded.length > 0) {
    try {
      let lat = 0, lng = 0, index = 0;
      const len = encoded.length;
      while (index < len) {
        let shift = 0, result = 0;
        let byte;
        do {
          byte = encoded.charCodeAt(index++) - 63;
          result |= (byte & 0x1f) << shift;
          shift += 5;
        } while (byte >= 0x20);
        const dlat = (result & 1) ? ~(result >> 1) : (result >> 1);
        lat += dlat;

        shift = 0; result = 0;
        do {
          byte = encoded.charCodeAt(index++) - 63;
          result |= (byte & 0x1f) << shift;
          shift += 5;
        } while (byte >= 0x20);
        const dlng = (result & 1) ? ~(result >> 1) : (result >> 1);
        lng += dlng;

        allCoords.push([lat / 1e5, lng / 1e5]);
      }
    } catch(e) {}
  }

  return allCoords;
}

function drawRoutePolyline(dayNum, routeIdx, encodedPolyline, mode) {
  if (!map) return;
  const coords = decodeAmapPolyline(encodedPolyline);
  if (coords.length < 2) return;

  const colors = { walking: '#52b788', driving: '#e07a5f', transit: '#3d85c6' };
  const color = colors[mode] || '#888';

  const polyline = L.polyline(coords, {
    color: color, weight: 4, opacity: 0.7, dashArray: mode === 'walking' ? '6 4' : null
  });
  polyline._day = dayNum;
  polyline._routeIdx = routeIdx;
  polyline._isRoute = true;
  polyline.addTo(map);
  _routePolylines.push(polyline);
}

function clearRoutePolylines() {
  _routePolylines.forEach(r => { if (map) map.removeLayer(r); });
  _routePolylines = [];
}

// Timeout wrapper for fetch
async function fetchWithTimeout(url, ms, options) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), ms);
  try {
    const opts = options ? { ...options, signal: controller.signal } : { signal: controller.signal };
    const resp = await fetch(url, opts);
    return resp;
  } finally {
    clearTimeout(timeout);
  }
}

function parseItineraryText(text) {
  // Normalize: remove leading whitespace, unify newlines
  text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
  const lines = text.split('\n');

  // Detect trip name — first meaningful non-Day line, or derive from content
  let tripName = '导入行程';
  let destination = '';
  let travelers = ['我'];

  // Split into day blocks
  const dayBlocks = [];
  let currentBlock = null;

  // Regex to detect day headers
  const dayHeaderRe = /^(?:Day\s*(\d+)|第\s*(\d+)\s*天|[Dd](\d+))\s*[:：]?\s*$/;
  // Regex to detect dates: 8/15, 08/15, 8-15, 2026/8/15, 8月15日, 8月15

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    const dayMatch = line.match(dayHeaderRe);
    if (dayMatch) {
      if (currentBlock) dayBlocks.push(currentBlock);
      const dayNum = parseInt(dayMatch[1] || dayMatch[2] || dayMatch[3]);
      currentBlock = { dayNumber: dayNum || (dayBlocks.length + 1), date: '', rawLines: [] };
      continue;
    }

    // If no day header found yet but we have content, create block
    if (!currentBlock && dayBlocks.length === 0) {
      currentBlock = { dayNumber: 1, date: '', rawLines: [] };
    }

    if (currentBlock) {
      currentBlock.rawLines.push(line);
    }
  }
  if (currentBlock) dayBlocks.push(currentBlock);

  if (dayBlocks.length === 0) {
    // Fallback: no day headers detected, treat entire text as one day
    dayBlocks.push({ dayNumber: 1, date: '', rawLines: lines.filter(l => l.trim()) });
  }

  // Date regex patterns
  const dateRe = /^(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?(?:\s*$|\s+)/;
  const dateReCN = /(\d{1,2})月(\d{1,2})[日号]/;

  // Time regex: "7:03-8:53", "9:15", "10:00-11:00*", "2:00"
  const timeRe = /^(\d{1,2}):(\d{2})\s*[-–—~到至]\s*(\d{1,2})?:?(\d{2})?/;
  const timeOnlyRe = /^(\d{1,2}):(\d{2})\b/;

  // Parse each day block
  const parsedDays = [];
  for (const block of dayBlocks) {
    const activities = [];
    let currentAct = null;

    for (const line of block.rawLines) {
      // Check if line is a date
      const dateMatch = line.match(dateRe) || line.match(dateReCN);
      if (dateMatch && !block.date) {
        const month = parseInt(dateMatch[1]);
        const day = parseInt(dateMatch[2]);
        const now = new Date();
        const year = now.getMonth() + 1 > month ? now.getFullYear() + 1 :
                     (now.getMonth() + 1 === month && now.getDate() > day ? now.getFullYear() + 1 : now.getFullYear());
        block.date = year + '-' + String(month).padStart(2,'0') + '-' + String(day).padStart(2,'0');
        destination = destination || detectDestination(line);
        continue;
      }

      const timeMatch = line.match(timeRe) || line.match(timeOnlyRe);
      if (timeMatch) {
        // Start new activity
        if (currentAct) activities.push(currentAct);

        let timeStr = '';
        if (timeMatch[3]) {
          // Has end time: "7:03-8:53"
          const endH = timeMatch[3], endM = timeMatch[4] || '00';
          timeStr = timeMatch[1] + ':' + timeMatch[2] + ' - ' + endH + ':' + endM;
        } else {
          timeStr = timeMatch[1] + ':' + timeMatch[2];
        }

        // Get text after time
        let afterTime = line.substring(timeMatch[0].length).replace(/^[：:\s*-]*/, '').trim();

        // Handle placeholder lines (just "*" or empty after time)
        if (!afterTime || afterTime === '*' || afterTime.length < 2) {
          afterTime = '';
        }

        // Parse activity details from text
        const { title, description, type, locationName } = parseActivityLine(afterTime || line.substring(timeMatch[0].length + (afterTime ? 0 : 1)));

        currentAct = {
          id: uuid(),
          time: timeStr,
          title: title || (afterTime || line).substring(0, 50).replace(/[*]+/g, '').trim() || '自由活动',
          description: description,
          type: type,
          location: locationName ? { name: locationName, lat: null, lng: null } : null,
          highlight: false,
          done: false,
          spotStory: null
        };

        // Update destination
        if (!destination && locationName) {
          destination = detectDestination(locationName);
        }
      } else if (currentAct) {
        // Continuation of previous activity description
        const trimmed = line.replace(/^[：:\s*-]*/, '').trim();
        if (trimmed) {
          currentAct.description = (currentAct.description ? currentAct.description + ' ' : '') + trimmed;
        }
      } else {
        // Lone line without time — treat as activity without specific time
        const { title, description, type, locationName } = parseActivityLine(line);
        currentAct = {
          id: uuid(),
          time: '',
          title: title || line.substring(0, 40),
          description: description,
          type: type,
          location: locationName ? { name: locationName, lat: null, lng: null } : null,
          highlight: false,
          done: false,
          spotStory: null
        };
        activities.push(currentAct);
        currentAct = null;
      }
    }
    // Push last activity
    if (currentAct) activities.push(currentAct);

    parsedDays.push({
      dayNumber: block.dayNumber,
      date: block.date || '',
      activities: activities
    });
  }

  // Derive destination from content
  if (!destination) {
    for (const d of parsedDays) {
      for (const a of d.activities) {
        if (a.location) { destination = a.location.name; break; }
        if (a.title) { destination = detectDestination(a.title); if (destination) break; }
      }
      if (destination) break;
    }
  }
  destination = destination || '未知';

  // Derive trip name
  tripName = destination + '之旅';

  // Set dates if missing (use fmtLocalDate to avoid timezone shift)
  const tomorrow = new Date();
  tomorrow.setDate(tomorrow.getDate() + 1);
  let startDate = parsedDays[0]?.date || fmtLocalDate(tomorrow);
  for (let i = 0; i < parsedDays.length; i++) {
    if (!parsedDays[i].date) {
      const parts = startDate.split('-');
      const dt = new Date(+parts[0], +parts[1] - 1, +parts[2] + i);
      parsedDays[i].date = fmtLocalDate(dt);
    }
  }

  return {
    id: uuid(),
    name: tripName,
    destination,
    startDate: parsedDays[0]?.date || startDate,
    endDate: parsedDays[parsedDays.length - 1]?.date || startDate,
    travelers,
    createdAt: new Date().toISOString(),
    days: parsedDays,
    budget: {
      categories: {
        '交通': { budget: 0, actual: 0 }, '住宿': { budget: 0, actual: 0 },
        '餐饮': { budget: 0, actual: 0 }, '门票': { budget: 0, actual: 0 },
        '购物': { budget: 0, actual: 0 }, '其他': { budget: 0, actual: 0 }
      }
    },
    packingList: [],
    tips: [],
    expenses: []
  };
}

function parseActivityLine(text) {
  let title = text.trim();
  let description = '';
  let type = 'other';
  let locationName = '';

  // Split by common separators: parenthesis content -> description
  const parenMatch = title.match(/^(.+?)[（(]([^)）]+)[）)]/);
  if (parenMatch) {
    description = parenMatch[2];
    title = parenMatch[1];
  }

  // Split by Chinese comma / dash
  const dashMatch = title.match(/^(.+?)[，,。、；;——](.+)$/);
  if (dashMatch && dashMatch[2].length < title.length * 0.6) {
    if (!description) description = dashMatch[2];
    title = dashMatch[1];
  }

  // Detect location names (common patterns)
  const locPatterns = [
    /(?:去|到|在)(.{2,6})(?:站|公园|广场|天地|寺|庙|塔|宫|山|湖|海|园|馆|楼|街|路|面馆|饭店|餐厅|酒店|影院|泳馆|游泳馆)/,
    /(?:逛逛|游览|参观)(.{2,6})$/,
    /(?:前往|直奔|去|到)(.{2,6}?)(?:吃|玩|逛|看|喝|买|游泳|$)/,
    /(.{2,5})(?:站|公园|广场|天地|寺|庙|塔|宫|山|湖|海|园|馆|楼|街|路|面馆|饭店|餐厅|酒店|影院|泳馆)/,
  ];
  for (const re of locPatterns) {
    const m = title.match(re);
    if (m && m[1] && !/坐|打车|步行|公交|车去|回去|回家|末班|坐车|哪辆|辆车/.test(m[1])) {
      locationName = m[1].replace(/^[到去在]+/, '');
      if (locationName.length >= 2) break;
      else locationName = '';
    }
  }

  // Infer type
  type = inferActivityType({ title, description, type: '' });

  return { title, description, type, locationName };
}

function detectDestination(text) {
  // Priority 1: city pairs in transport lines like "宁波-嘉兴", "嘉兴-宁波"
  const transportMatch = text.match(/([一-鿿]{2,4})[-–—]([一-鿿]{2,4})/);
  if (transportMatch) {
    // Return the SECOND city (the destination of the trip)
    // For "宁波-嘉兴" (leaving Ningbo for Jiaxing), Jiaxing is the destination
    const to = transportMatch[2];
    const knownCities = ['宁波','嘉兴','杭州','上海','北京','南京','苏州','无锡','常州','武汉','成都','重庆','广州','深圳','西安','长沙','厦门','青岛','大连','昆明','贵阳','三亚','桂林','丽江','黄山','乌镇','西塘','南浔'];
    if (knownCities.some(c => c === to || to.includes(c))) return to;
  }
  // Priority 2: known city names
  const knownCitiesRe = /(宁波|嘉兴|杭州|上海|北京|南京|苏州|无锡|常州|武汉|成都|重庆|广州|深圳|西安|长沙|厦门|青岛|大连|昆明|贵阳|三亚|桂林|丽江|黄山|乌镇|西塘|南浔|周庄|同里)/;
  const m = text.match(knownCitiesRe);
  if (m) return m[1];
  return '';
}

function inferActivityType(activity) {
  const title = (activity.title || '').toLowerCase();
  const type = (activity.type || '').toLowerCase();
  const desc = (activity.description || '').toLowerCase();
  const combined = title + type + desc;

  if (/酒店|住宿|宾馆|民宿|入住|check.?in|hotel/i.test(combined)) return 'hotel';
  if (/高铁|火车|动车|飞机|航班|大巴|地铁|出租|打车|骑行|租车|transport|交通/i.test(combined)) return 'transport';
  if (/吃饭|餐厅|午饭|晚饭|早餐|午餐|晚餐|美食|小吃|饭店|菜馆|food|餐饮/i.test(combined)) return 'food';
  if (/购物|商场|买|逛街|shop/i.test(combined)) return 'shopping';
  // Default to sightseeing for most attractions
  if (/景点|公园|寺|庙|塔|宫|山|湖|海|园|博物馆|广场|街|sightseeing|游览|参观|打卡|游玩/i.test(combined)) return 'sightseeing';
  if (type === 'sightseeing' || type === 'food' || type === 'transport' || type === 'hotel' || type === 'shopping') return type;

  return 'sightseeing'; // default
}

// ============================================================
// HELPERS
// ============================================================
function getApiBase() {
  // If opened via server (http/https), use same origin
  if (window.location.protocol.startsWith('http')) {
    return window.location.origin;
  }
  // If opened via file://, default to localhost server
  return 'http://localhost:8888';
}

function isFileProtocol() {
  return window.location.protocol === 'file:';
}

// ============================================================
// INITIALIZATION
// ============================================================
function init() {
  // Check if viewing a shared trip (URL: /s/<id> or #share=<data>)
  const shareInfo = getShareIdFromURL();
  if (shareInfo) {
    (async () => {
      const trip = await loadSharedTrip(shareInfo);
      if (trip) {
        renderSharedTripView(trip);
      } else {
        document.getElementById('home-content').innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">😕</div>
            <h3>未找到该行程</h3>
            <p>该分享链接已失效或不存在</p>
          </div>`;
      }
    })();
    return;
  }

  // Sync from GitHub first (shared data), then fall back to sample data
  syncFromGitHub(true).then(ghData => {
    const data = createSampleData();
    if (!ghData) {
      // Push local sample data to GitHub so others can see it
      saveData(data);
    }
    renderHome();
    setupWechatShare();
  });
}

init();
</script>
