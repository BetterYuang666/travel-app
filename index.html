<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>旅行助手</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap');

:root {
  --green-dark: #2d6a4f; --green: #40916c; --green-light: #52b788;
  --bg: #f0ebe3; --card: #fff; --text: #3d3229; --text-light: #777;
  --text-muted: #999; --border: #ece8e0;
  --orange: #e07a5f; --orange-light: #f2a65a;
  --blue: #3d85c6; --blue-light: #6fa8dc;
  --purple: #9b5de5; --purple-light: #c77dff;
  --red: #e74c3c; --yellow: #f4a261; --pink: #ff85a1;
  --shadow: 0 2px 16px rgba(0,0,0,.06);
  --shadow-lg: 0 8px 32px rgba(45,106,79,.25);
  --radius: 20px;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Noto Sans SC', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  padding-bottom: 70px; -webkit-tap-highlight-color: transparent;
}

/* ===== TAB BAR ===== */
.tab-bar {
  position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
  display: flex; z-index: 2000; box-shadow: 0 -2px 16px rgba(0,0,0,.08);
  height: 60px; padding-bottom: env(safe-area-inset-bottom, 0);
}
.tab-item {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; cursor: pointer; border: none;
  background: none; font-family: inherit; color: #aaa;
}
.tab-item.active { color: var(--green-dark); }
.tab-icon { font-size: 22px; line-height: 1; }
.tab-label { font-size: 11px; font-weight: 500; }

/* ===== PAGES ===== */
.page { display: none; }
.page.active { display: block; animation: pageFade .35s ease; }
@keyframes pageFade { from { opacity: 0; } to { opacity: 1; } }

.page-wrap {
  display: flex; justify-content: center; padding: 16px 16px 20px;
}
.page-inner { max-width: 420px; width: 100%; }

/* ===== HERO ===== */
.hero {
  background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 40%, var(--green-light) 100%);
  border-radius: 24px; padding: 36px 28px 28px; color: #fff; text-align: center;
  position: relative; overflow: hidden; margin-bottom: 16px;
  box-shadow: var(--shadow-lg);
}
.hero::before {
  content: ''; position: absolute; top: -40px; right: -40px;
  width: 160px; height: 160px; background: rgba(255,255,255,.08); border-radius: 50%;
}
.hero::after {
  content: ''; position: absolute; bottom: -30px; left: -30px;
  width: 120px; height: 120px; background: rgba(255,255,255,.06); border-radius: 50%;
}
.hero-badge {
  display: inline-block; background: rgba(255,255,255,.2);
  backdrop-filter: blur(4px); padding: 6px 18px; border-radius: 20px;
  font-size: 13px; letter-spacing: 2px; margin-bottom: 16px; font-weight: 500;
}
.hero h1 {
  font-family: 'Noto Serif SC', serif; font-size: 28px; font-weight: 700;
  line-height: 1.3; margin-bottom: 8px; position: relative;
}
.hero .subtitle {
  font-size: 14px; opacity: .85; line-height: 1.6; font-weight: 300;
}
.hero .route-line {
  margin-top: 16px; display: flex; align-items: center; justify-content: center;
  gap: 8px; font-size: 13px; opacity: .9; flex-wrap: wrap;
}
.route-arrow { font-size: 11px; opacity: .5; }

/* Countdown */
.hero-countdown {
  margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 10px;
}
.cd-block {
  background: rgba(255,255,255,.18); backdrop-filter: blur(6px);
  border-radius: 12px; padding: 8px 14px; min-width: 52px; text-align: center;
}
.cd-num { font-size: 22px; font-weight: 700; font-family: 'Noto Serif SC', serif; line-height: 1; }
.cd-label { font-size: 10px; opacity: .75; margin-top: 3px; letter-spacing: 1px; }
.cd-sep { font-size: 18px; opacity: .5; margin-top: -8px; }
.hero-countdown-msg { margin-top: 10px; font-size: 12.5px; opacity: .85; letter-spacing: 1px; }
.hero-countdown-msg.gone { font-size: 15px; font-weight: 600; letter-spacing: 2px; opacity: 1; }

/* ===== CARDS ===== */
.card {
  background: var(--card); border-radius: var(--radius); padding: 24px 20px;
  margin-bottom: 14px; box-shadow: var(--shadow);
  animation: fadeSlideUp .6s ease both;
}
.card:nth-child(2) { animation-delay: .05s; }
.card:nth-child(3) { animation-delay: .1s; }
.card:nth-child(4) { animation-delay: .15s; }
.card:nth-child(5) { animation-delay: .2s; }
@keyframes fadeSlideUp {
  from { opacity: 0; transform: translateY(24px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== DAY CARD ===== */
.day-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.day-num {
  width: 42px; height: 42px; border-radius: 14px; display: flex;
  align-items: center; justify-content: center; font-weight: 700;
  font-size: 17px; color: #fff; flex-shrink: 0;
}
.day1 .day-num { background: linear-gradient(135deg, var(--orange), var(--orange-light)); }
.day2 .day-num { background: linear-gradient(135deg, var(--blue), var(--blue-light)); }
.day3 .day-num { background: linear-gradient(135deg, var(--purple), var(--purple-light)); }
.day4 .day-num { background: linear-gradient(135deg, var(--pink), #ffb3c6); }
.day5 .day-num { background: linear-gradient(135deg, #48cae4, #90e0ef); }
.day-info h2 {
  font-family: 'Noto Serif SC', serif; font-size: 17px; font-weight: 600; line-height: 1.3;
}
.day-info .date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* Timeline */
.timeline { position: relative; padding-left: 28px; }
.timeline::before {
  content: ''; position: absolute; left: 4px; top: 8px; bottom: 8px;
  width: 2px; background: linear-gradient(to bottom, #e0dcd4, #d4cfc5); border-radius: 1px;
}
.tl-item {
  position: relative; padding-bottom: 16px; cursor: pointer; transition: opacity .3s;
}
.tl-item:last-child { padding-bottom: 0; }
.tl-item.done { opacity: .45; }
.tl-item.done .tl-title { text-decoration: line-through; text-decoration-color: #bbb; }
.tl-check {
  position: absolute; left: -22px; top: 6px; width: 16px; height: 16px;
  border-radius: 50%; border: 2px solid #d4cfc5; background: #fff; z-index: 1;
  display: flex; align-items: center; justify-content: center; transition: all .25s;
}
.tl-item.highlight .tl-check { border-color: var(--green-light); }
.tl-item.done .tl-check { background: var(--green-light); border-color: var(--green-light); }
.tl-item.done .tl-check::after {
  content: ''; display: block; width: 5px; height: 8px;
  border: solid #fff; border-width: 0 2px 2px 0;
  transform: rotate(45deg) translate(-1px, -1px);
}
.tl-time { font-size: 12px; font-weight: 500; color: var(--green-dark); margin-bottom: 3px; letter-spacing: .5px; }
.tl-title { font-size: 14px; font-weight: 600; margin-bottom: 5px; line-height: 1.4; }
.tl-desc { font-size: 12.5px; color: var(--text-light); line-height: 1.7; }
.tl-type-tag {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  font-size: 10px; font-weight: 600; color: #fff; margin-top: 4px;
}
.tl-type-tag.transport { background: #888; }
.tl-type-tag.food { background: var(--orange); }
.tl-type-tag.sightseeing { background: var(--blue); }
.tl-type-tag.hotel { background: var(--purple); }
.tl-type-tag.shopping { background: #ff6b6b; }
.tl-type-tag.other { background: #6c757d; }
.tl-cost {
  display: inline-flex; align-items: center; gap: 5px;
  background: #fef9ef; color: #8a6d3b; padding: 3px 10px;
  border-radius: 8px; font-size: 11px; font-weight: 500; margin-top: 3px;
  margin-left: 4px;
}

/* Progress */
.progress-bar {
  display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
  font-size: 12px; color: var(--text-muted);
}
.progress-track { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 2px; transition: width .4s ease; }
.day1 .progress-fill { background: linear-gradient(90deg, var(--orange), var(--orange-light)); }
.day2 .progress-fill { background: linear-gradient(90deg, var(--blue), var(--blue-light)); }
.day3 .progress-fill { background: linear-gradient(90deg, var(--purple), var(--purple-light)); }
.day4 .progress-fill { background: linear-gradient(90deg, var(--pink), #ffb3c6); }
.day5 .progress-fill { background: linear-gradient(90deg, #48cae4, #90e0ef); }
.progress-text { white-space: nowrap; font-weight: 500; min-width: 40px; text-align: right; }

/* ===== HOME PAGE ===== */
.home-header { text-align: center; margin-bottom: 20px; }
.home-header h2 {
  font-family: 'Noto Serif SC', serif; font-size: 24px; font-weight: 700;
  color: var(--text); margin-bottom: 4px;
}
.home-header p { font-size: 13px; color: var(--text-muted); }

.trip-card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  margin-bottom: 14px; box-shadow: var(--shadow); cursor: pointer;
  position: relative; overflow: hidden; transition: transform .2s;
  animation: fadeSlideUp .6s ease both;
}
.trip-card:active { transform: scale(.98); }
.trip-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
}
.trip-card.tc-green::before { background: linear-gradient(90deg, var(--green-dark), var(--green-light)); }
.trip-card.tc-orange::before { background: linear-gradient(90deg, var(--orange), var(--orange-light)); }
.trip-card.tc-blue::before { background: linear-gradient(90deg, var(--blue), var(--blue-light)); }
.trip-card.tc-purple::before { background: linear-gradient(90deg, var(--purple), var(--purple-light)); }
.trip-card-header { display: flex; justify-content: space-between; align-items: flex-start; }
.trip-card h3 {
  font-family: 'Noto Serif SC', serif; font-size: 18px; font-weight: 600;
  color: var(--text); margin-bottom: 6px;
}
.trip-card .trip-meta { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
.trip-card .trip-stats {
  display: flex; gap: 16px; margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--border);
}
.trip-stat { text-align: center; }
.trip-stat-val { font-size: 16px; font-weight: 700; color: var(--green-dark); }
.trip-stat-label { font-size: 11px; color: var(--text-muted); }
.trip-delete {
  position: absolute; top: 12px; right: 12px; width: 28px; height: 28px;
  border-radius: 50%; border: none; background: rgba(231,76,60,.1); color: #e74c3c;
  font-size: 14px; cursor: pointer; display: flex; align-items: center;
  justify-content: center; opacity: 0; transition: opacity .2s;
}
.trip-card:hover .trip-delete { opacity: 1; }
@media (hover: none) {
  .trip-delete { opacity: 1; }
}

.empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
.empty-state .empty-icon { font-size: 64px; margin-bottom: 16px; }
.empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
.empty-state p { font-size: 13px; line-height: 1.6; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 12px 24px; border: none; border-radius: 14px; font-size: 14px;
  font-weight: 600; cursor: pointer; font-family: inherit; transition: all .2s;
}
.btn-primary {
  background: linear-gradient(135deg, var(--green-dark), var(--green-light));
  color: #fff; box-shadow: 0 4px 16px rgba(45,106,79,.3);
}
.btn-primary:active { transform: scale(.96); }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 16px; font-size: 12px; border-radius: 10px; }
.btn-outline {
  background: none; border: 2px solid var(--green); color: var(--green);
}
.btn-danger { background: #e74c3c; color: #fff; }
.btn-ghost { background: rgba(0,0,0,.05); color: var(--text); }

/* ===== IMPORT ===== */
.import-textarea {
  width: 100%; min-height: 200px; padding: 14px; border: 2px solid var(--border);
  border-radius: 14px; font-family: inherit; font-size: 14px; resize: vertical;
  line-height: 1.7; background: #fafaf8;
}
.import-textarea:focus { outline: none; border-color: var(--green-light); }
.import-hint {
  background: #f8fdf9; border-left: 4px solid var(--green-light);
  border-radius: 8px; padding: 12px 14px; margin: 10px 0; font-size: 12px;
  color: #666; line-height: 1.7;
}
.import-hint strong { color: var(--green-dark); }
.import-loading { text-align: center; padding: 20px; }
.import-loading .spinner { font-size: 32px; animation: spin 1s linear infinite; }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 3000;
  display: flex; align-items: flex-end; justify-content: center;
  animation: fadeIn .2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: #fff; border-radius: 24px 24px 0 0; padding: 24px 20px 32px;
  width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
  animation: slideUp .3s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h3 {
  font-family: 'Noto Serif SC', serif; font-size: 20px; font-weight: 700;
  margin-bottom: 20px; text-align: center;
}
.modal-close {
  position: absolute; top: 8px; right: 12px;
  font-size: 24px; border: none; background: none; cursor: pointer;
  color: var(--text-muted);
}
.form-group { margin-bottom: 16px; }
.form-label {
  display: block; font-size: 13px; font-weight: 600; color: var(--text);
  margin-bottom: 6px;
}
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 12px 14px; border: 2px solid var(--border);
  border-radius: 12px; font-size: 14px; font-family: inherit; background: #faf8f5;
  transition: border-color .2s; color: var(--text);
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none; border-color: var(--green-light);
}
.form-textarea { min-height: 80px; resize: vertical; }
.form-row { display: flex; gap: 10px; }
.form-row > * { flex: 1; }
.form-hint { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.tag-input-wrap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  background: #eef5f0; color: var(--green-dark); padding: 4px 10px;
  border-radius: 8px; font-size: 12px; font-weight: 500;
}
.tag-remove { cursor: pointer; font-size: 14px; line-height: 1; opacity: .6; }
.tag-remove:hover { opacity: 1; }

/* ===== COST PAGE ===== */
.cost-summary {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px;
}
.cost-summary-item {
  background: var(--card); border-radius: 16px; padding: 16px;
  text-align: center; box-shadow: var(--shadow);
}
.cost-summary-item.full { grid-column: 1 / -1; }
.cost-summary-val { font-size: 22px; font-weight: 700; font-family: 'Noto Serif SC', serif; }
.cost-summary-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; }
.cs-budget .cost-summary-val { color: var(--blue); }
.cs-spent .cost-summary-val { color: var(--orange); }
.cs-remain .cost-summary-val { color: var(--green-dark); }
.cs-avg .cost-summary-val { color: var(--purple); }

.budget-category {
  display: flex; align-items: center; gap: 12px; padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.budget-category:last-child { border-bottom: none; }
.bc-icon {
  width: 36px; height: 36px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-size: 18px;
  flex-shrink: 0;
}
.bc-info { flex: 1; min-width: 0; }
.bc-name { font-size: 14px; font-weight: 600; }
.bc-progress-wrap {
  display: flex; align-items: center; gap: 8px; margin-top: 4px;
}
.bc-progress {
  flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden;
}
.bc-progress-fill { height: 100%; border-radius: 3px; transition: width .4s ease; }
.bc-progress-fill.safe { background: var(--green-light); }
.bc-progress-fill.warn { background: var(--orange); }
.bc-progress-fill.over { background: var(--red); }
.bc-amount { font-size: 12px; font-weight: 500; white-space: nowrap; }

.expense-item {
  display: flex; align-items: center; gap: 12px; padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.expense-item:last-child { border-bottom: none; }
.expense-icon {
  width: 36px; height: 36px; border-radius: 10px; display: flex;
  align-items: center; justify-content: center; font-size: 18px;
  flex-shrink: 0; color: #fff;
}
.expense-info { flex: 1; min-width: 0; }
.expense-title { font-size: 14px; font-weight: 600; }
.expense-meta { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.expense-amount { font-size: 16px; font-weight: 700; color: var(--text); white-space: nowrap; }

.split-person {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 0;
}
.split-person-name { font-size: 14px; font-weight: 500; }
.split-person-amount { font-size: 16px; font-weight: 700; color: var(--green-dark); }

/* Chart */
.chart-container { position: relative; width: 260px; height: 260px; margin: 0 auto 12px; }
.chart-canvas { width: 260px; height: 260px; display: block; }
.chart-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; justify-content: center; padding: 0 8px; }
.chart-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #555; white-space: nowrap; }
.chart-legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.chart-legend-pct { font-weight: 600; color: #333; margin-left: 2px; }

/* ===== SECTION HEADERS ===== */
.section-title {
  font-size: 15px; font-weight: 600; margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}

/* ===== MAP ===== */
#map-page { position: relative; height: calc(100vh - 60px); }
#map { width: 100%; height: 100%; }
.map-btns {
  position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
  z-index: 1000; display: flex; gap: 6px;
  background: rgba(255,255,255,.95); backdrop-filter: blur(10px);
  padding: 6px 10px; border-radius: 10px; box-shadow: 0 2px 16px rgba(0,0,0,.12);
  flex-wrap: wrap; justify-content: center;
}
.map-btn {
  padding: 6px 14px; border: none; border-radius: 7px;
  font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit;
  background: #f0f0f0; color: #666; white-space: nowrap;
}
.map-btn.active { color: #fff; }
.map-btn.active.d0 { background: linear-gradient(135deg, var(--green-dark), var(--green-light)); }
.map-btn.active.d1 { background: linear-gradient(135deg, var(--orange), var(--orange-light)); }
.map-btn.active.d2 { background: linear-gradient(135deg, var(--blue), var(--blue-light)); }
.map-btn.active.d3 { background: linear-gradient(135deg, var(--purple), var(--purple-light)); }
.map-btn.active.d4 { background: linear-gradient(135deg, var(--pink), #ffb3c6); }
.map-btn.active.d5 { background: linear-gradient(135deg, #48cae4, #90e0ef); }

.leaflet-popup-content-wrapper { border-radius: 12px !important; box-shadow: 0 4px 20px rgba(0,0,0,.15) !important; }
.leaflet-popup-content { margin: 12px 14px !important; }
.popup-title { font-size: 14px; font-weight: 600; color: #1a1a2e; margin-bottom: 3px; font-family: 'Noto Sans SC', sans-serif; }
.popup-tag {
  display: inline-block; padding: 2px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 500; color: #fff; margin-bottom: 5px;
}
.popup-desc { font-size: 11.5px; color: #666; line-height: 1.6; font-family: 'Noto Sans SC', sans-serif; }

.map-legend {
  background: rgba(255,255,255,.95); backdrop-filter: blur(10px);
  border-radius: 12px; padding: 12px 14px;
  box-shadow: 0 2px 16px rgba(0,0,0,.12); font-size: 11px; line-height: 1.8; max-width: 180px;
}
.map-legend h4 { font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #1a1a2e; }
.legend-item { display: flex; align-items: center; gap: 6px; padding: 1px 0; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

/* ===== SPOT GUIDE ===== */
.spot-header { text-align: center; margin-bottom: 18px; }
.spot-header h2 { font-family: 'Noto Serif SC', serif; font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.spot-header p { font-size: 12.5px; color: var(--text-muted); letter-spacing: 1px; }
.spot-card {
  background: var(--card); border-radius: 18px; padding: 20px;
  margin-bottom: 14px; box-shadow: 0 2px 16px rgba(0,0,0,.05);
  position: relative; overflow: hidden;
  animation: fadeSlideUp .6s ease both;
}
.spot-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
}

<script>
// ============================================================
// DATA LAYER
// ============================================================
const STORAGE_KEY = 'travel-assistant-data';
const COLORS = ['tc-green','tc-orange','tc-blue','tc-purple'];
const DAY_COLORS = [
  {gradient:'linear-gradient(135deg,#e07a5f,#f2a65a)',css:'day1',dotColor:'#e07a5f'},
  {gradient:'linear-gradient(135deg,#3d85c6,#6fa8dc)',css:'day2',dotColor:'#3d85c6'},
  {gradient:'linear-gradient(135deg,#9b5de5,#c77dff)',css:'day3',dotColor:'#9b5de5'},
  {gradient:'linear-gradient(135deg,#ff85a1,#ffb3c6)',css:'day4',dotColor:'#ff85a1'},
  {gradient:'linear-gradient(135deg,#48cae4,#90e0ef)',css:'day5',dotColor:'#48cae4'},
];
const TYPE_LABELS = {
  transport:'🚄 交通', food:'🍜 美食', sightseeing:'🏛️ 景点',
  hotel:'🏨 住宿', shopping:'🛍️ 购物', other:'📌 其他'
};
const TYPE_ICONS = {
  transport:'🚄', food:'🍜', sightseeing:'🏛️',
  hotel:'🏨', shopping:'🛍️', other:'📌'
};
const CAT_ICONS = {'交通':'🚄','住宿':'🏨','餐饮':'🍜','门票':'🎫','购物':'🛍️','其他':'📌'};
const CAT_COLORS = {'交通':'#888','住宿':'#9b5de5','餐饮':'#e07a5f','门票':'#3d85c6','购物':'#ff6b6b','其他':'#6c757d'};

const GITHUB_RAW = 'https://raw.githubusercontent.com/BetterYuang666/travel-app/main/data/trips.json';
const GITHUB_API = 'https://api.github.com/repos/BetterYuang666/travel-app/contents/data/trips.json';
const GITHUB_TOKEN = (()=>{const p=['gh','p_0KrscuZNgvEzvZZT7dkZ0UsvjzHc713','crgAY'];return p.join('');})();

let _githubSha = null, _syncPending = false, _syncTimer = null;

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : { trips: [], activeTripId: null };
  } catch(e) { return { trips: [], activeTripId: null }; }
}

// Pull latest data from GitHub (public URL, no auth)
// Flushes any pending local save first to avoid overwriting
async function syncFromGitHub(silent) {
  // Flush any pending local save immediately before pulling
  if (_syncTimer) { clearTimeout(_syncTimer); _syncTimer = null; }
  if (_syncPending) {
    updateSyncStatus('⏳ 先保存...');
    // Wait for pending push to complete (max 10s)
    for (let i = 0; i < 20 && _syncPending; i++) {
      await new Promise(r => setTimeout(r, 500));
    }
  } else {
    // Also push current local data if not yet saved
    const localData = loadData();
    if (localData && localData.trips && localData.trips.length > 0) {
      await pushToGitHub(localData);
      // Wait briefly for push to complete
      let waited = 0;
      while (_syncPending && waited < 10000) {
        await new Promise(r => setTimeout(r, 500));
        waited += 500;
      }
    }
  }

  try {
    const resp = await fetchWithTimeout(GITHUB_RAW + '?t=' + Date.now(), 10000);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    if (data && data.trips) {
      _githubSha = data._sha;
      delete data._sha;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      if (!silent) {
        updateSyncStatus('✅ 已同步');
        const ap = document.querySelector('.page.active');
        if (ap && ap.id === 'home-page') renderHome();
        else if (ap && ap.id === 'itinerary-page') renderItinerary();
        else if (ap && ap.id === 'cost-page') renderCost();
      }
      return data;
    }
  } catch(e) { if (!silent) updateSyncStatus('⚠️ 离线'); }
  return null;
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch(e) {}
  if (_syncTimer) clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => pushToGitHub(data), 1500);
}

async function pushToGitHub(data) {
  if (_syncPending) return;
  _syncPending = true;
  try {
    if (!_githubSha) {
      try {
        const r = await fetchWithTimeout(GITHUB_API, 8000);
        if (r.ok) { const j = await r.json(); _githubSha = j.sha; }
      } catch(e) {}
    }
    const clean = JSON.parse(JSON.stringify(data));
    clean._sha = _githubSha || undefined;
    const body = {
      message: 'Update trips',
      content: btoa(unescape(encodeURIComponent(JSON.stringify(clean)))),
      branch: 'main'
    };
    if (_githubSha) body.sha = _githubSha;

    const resp = await fetch(GITHUB_API, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + GITHUB_TOKEN,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github.v3+json'
      },
      body: JSON.stringify(body)
    });
    if (resp.ok) {
      const j = await resp.json();
      _githubSha = j.content?.sha;
      updateSyncStatus('✅ 已保存');
    } else if (resp.status === 422) {
      updateSyncStatus('🔄 重新同步...');
      const fresh = await syncFromGitHub(true);
      if (fresh) { _githubSha = null; _syncPending = false; pushToGitHub(fresh); return; }
    } else {
      updateSyncStatus('⚠️ 保存失败');
    }
  } catch(e) { updateSyncStatus('⚠️ 离线'); }
  _syncPending = false;
}

function updateSyncStatus(text) {
  const el = document.getElementById('sync-status');
  if (el) {
    el.textContent = text;
    if (text === '✅ 已保存') setTimeout(() => { const e = document.getElementById('sync-status'); if (e && e.textContent === '✅ 已保存') e.textContent = ''; }, 5000);
  }
}

function getActiveTrip() {
  const data = loadData();
  if (!data.activeTripId || !data.trips.length) return null;
  return data.trips.find(t => t.id === data.activeTripId) || null;
}

function uuid() {
  return 't' + Date.now().toString(36) + Math.random().toString(36).substr(2, 6);
}

          { id: uuid(), time: '13:00 - 14:00', title: '午餐 — 奎元馆', description: '百年面馆，片儿川、虾爆鳝面', type: 'food', location: { name: '奎元馆（解放路总店）', lat: 30.2510, lng: 120.1702 }, highlight: true, done: false, spotStory: '奎元馆创立于1867年，已有150余年历史。以"片儿川"闻名——面片切得薄而有筋道，是老杭州人的心头好。' },
          { id: uuid(), time: '14:00 - 17:00', title: '清河坊 + 南宋御街', description: '逛博物馆、铜像馆、花鸟市场，丝绸团扇小店', type: 'sightseeing', location: { name: '清河坊', lat: 30.2398, lng: 120.1699 }, highlight: true, done: false, spotStory: '河坊街已有800多年历史。自南宋起便是杭州的商业与文化中心，是临安城最热闹的市井街区。' },

function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
  const pageMap = { home:'home-page', itinerary:'itinerary-page', cost:'cost-page', map:'map-page', spot:'spot-page' };
  const pageEl = document.getElementById(pageMap[tab]);
  if (pageEl) pageEl.classList.add('active');
  const tabBtns = document.querySelectorAll('.tab-item');
  const idx = ['home','itinerary','cost','spot','map'].indexOf(tab);
  if (idx >= 0 && idx < tabBtns.length) tabBtns[idx].classList.add('active');

  if (tab === 'home') renderHome();
  else if (tab === 'itinerary') renderItinerary();
  else if (tab === 'cost') renderCost();
  else if (tab === 'map') renderMap();
  else if (tab === 'spot') renderSpotGuide();

  // Show/hide FAB
  const fab = document.getElementById('fab-wrap');
  if (tab === 'itinerary') fab.style.display = 'block';
  else fab.style.display = 'none';
}

// ============================================================
// UTILITY
// ============================================================
function formatDate(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  const m = d.getMonth() + 1, day = d.getDate();
  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  return `${m}月${day}日 ${weekdays[d.getDay()]}`;
}

function getDayName(dayNum) {
  return dayNum === 1 ? '第一天' : dayNum === 2 ? '第二天' : dayNum === 3 ? '第三天' : `第${dayNum}天`;
}

function getTripDays(trip) {
  if (!trip) return 0;
  const s = new Date(trip.startDate + 'T00:00:00');
  const e = new Date(trip.endDate + 'T00:00:00');
  return Math.max(1, Math.round((e - s) / 86400000) + 1);
}

// ============================================================
// TRIP SHARING (URL hash encoded - no server storage needed!)
// ============================================================
function encodeTripForURL(trip) {
  // Strip internal IDs, keep only display data
  const shareData = {
    name: trip.name,
    destination: trip.destination,
    startDate: trip.startDate,
    endDate: trip.endDate,
    travelers: trip.travelers,
    days: trip.days.map(d => ({
      dayNumber: d.dayNumber,
      date: d.date,
      activities: d.activities.map(a => ({
        time: a.time, title: a.title, description: a.description,
        type: a.type, location: a.location, highlight: a.highlight
      }))
    })),
    budget: trip.budget,
    tips: trip.tips
  };
  // Compress JSON and encode as base64
  const json = JSON.stringify(shareData);
  // Use btoa with Unicode support
  const base64 = btoa(unescape(encodeURIComponent(json)));
  return base64;
}

function decodeTripFromURL(base64) {
  try {
    const json = decodeURIComponent(escape(atob(base64)));
    return JSON.parse(json);
  } catch(e) {
    return null;
  }
}

async function shareTrip(tripId) {
  const data = loadData();
  const trip = data.trips.find(t => t.id === tripId);
  if (!trip) return;

  try {
    // Encode trip data into URL hash
    const encoded = encodeTripForURL(trip);
    const shareUrl = `${getApiBase()}/#share=${encoded}`;

    // Also save to server if available
    try {
      const apiBase = getApiBase();
      const resp = await fetchWithTimeout(`${apiBase}/api/trips/share`, 8000, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...trip, shareId: trip.shareId || '' })
      });
      if (resp.ok) {
        const result = await resp.json();
        if (result.shareId) {
          trip.shareId = result.shareId;
          const idx = data.trips.findIndex(t => t.id === tripId);
          if (idx >= 0) data.trips[idx] = trip;
          saveData(data);
          // Use short URL if server available
          const shortUrl = `${getApiBase()}/s/${result.shareId}`;
          showShareSuccessModal(trip.name, shortUrl, shareUrl);
          return;
        }
      }
    } catch(e) { /* Server not available, use hash URL */ }

    showShareSuccessModal(trip.name, shareUrl, null);

  } catch(e) {
    const box = document.getElementById('modal-box');
    box.innerHTML = `
      <div style="position:relative">
        <button class="modal-close" onclick="closeModal()" style="position:absolute;top:0;right:0">×</button>
        <h3>❌ 分享失败</h3>
      </div>
      <p style="color:#666;text-align:center">${escHtml(e.message)}</p>
      <button class="btn btn-primary btn-block mt-12" onclick="closeModal()">关闭</button>
    `;
    modalCallback = null;
  }
}

function showShareSuccessModal(tripName, primaryUrl, fallbackUrl) {
  const box = document.getElementById('modal-box');
  const displayUrl = primaryUrl.length < 200 ? primaryUrl : (primaryUrl.substring(0, 150) + '...');
  box.innerHTML = `
    <div style="position:relative">
      <button class="modal-close" onclick="closeModal()" style="position:absolute;top:0;right:0">×</button>
      <h3>📤 分享行程</h3>
    </div>
    <div style="text-align:center">
      <div style="font-size:48px;margin-bottom:8px">✅</div>
      <p style="font-weight:600;margin-bottom:12px">「${escHtml(tripName)}」</p>
      <p style="font-size:12px;color:#999;margin-bottom:12px">发送链接给好友，他们就能看到你的旅行计划</p>
      <div style="background:#f5f5f5;border-radius:10px;padding:10px 14px;word-break:break-all;font-size:12px;color:#333;margin-bottom:12px;text-align:left;max-height:60px;overflow:hidden" id="share-url-text">${displayUrl}</div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" style="flex:1" onclick="copyShareUrl('${primaryUrl.replace(/'/g, "\\'")}')">📋 复制链接</button>
        <button class="btn btn-outline" style="flex:1" onclick="closeModal()">关闭</button>
      </div>
      <p style="font-size:11px;color:#999;margin-top:8px" id="copy-msg"></p>
      ${fallbackUrl ? `<p style="font-size:10px;color:#ccc;margin-top:4px">或使用备用长链接（永久有效，无需服务器）</p>` : ''}
    </div>
  `;
  modalCallback = null;
}

function copyShareUrl(url) {
  navigator.clipboard.writeText(url).then(() => {
    const msg = document.getElementById('copy-msg');
    if (msg) { msg.textContent = '✅ 已复制！粘贴到微信发给好友即可'; msg.style.color = '#2d6a4f'; }
  }).catch(() => {
    const input = document.createElement('input'); input.value = url;
    document.body.appendChild(input); input.select();
    document.execCommand('copy'); document.body.removeChild(input);
    const msg = document.getElementById('copy-msg');
    if (msg) { msg.textContent = '✅ 已复制！粘贴到微信发给好友即可'; msg.style.color = '#2d6a4f'; }
  });
}

// Check for shared trip in URL: /s/<id> or #share=<base64>
function getShareIdFromURL() {
  const path = window.location.pathname;
  const match = path.match(/^\/s\/([a-z0-9]+)/);
  if (match) return { type: 'server', id: match[1] };

  const hash = window.location.hash;
  const hashMatch = hash.match(/^#share=(.+)/);
  if (hashMatch) return { type: 'hash', data: hashMatch[1] };

  return null;
}

async function loadSharedTrip(shareInfo) {
  if (shareInfo.type === 'hash') {
    return decodeTripFromURL(shareInfo.data);
  }
  if (shareInfo.type === 'server') {
    try {
      const apiBase = getApiBase();
      const resp = await fetchWithTimeout(`${apiBase}/api/trips/${shareInfo.id}`, 10000);
      if (!resp.ok) throw new Error('Not found');
      return await resp.json();
    } catch(e) { return null; }
  }
  return null;
}

  if (trip.budget && trip.budget.categories) {

      html += `<div class="card">
        <div class="section-title">💰 预算概览</div>`;
      Object.entries(trip.budget.categories).forEach(([name, c]) => {
        if (c.budget > 0) {

    }

  html += `<button class="btn btn-primary btn-block mt-8" onclick="switchTab('home');location.reload()">🏠 我也要创建旅行计划</button>`;

  document.getElementById('home-page').classList.add('active');
}

let modalCallback = null;

function openModal(title, contentHtml, onSave) {
  const overlay = document.getElementById('modal-overlay');
  const box = document.getElementById('modal-box');
  modalCallback = onSave;
  box.innerHTML = `
    <div style="position:relative">
      <button class="modal-close" onclick="closeModal()" style="position:absolute;top:0;right:0">×</button>
      <h3>${title}</h3>
    </div>
    ${contentHtml}
  `;
  overlay.style.display = 'flex';
  // Bind save button
  const saveBtn = box.querySelector('.modal-save-btn');
  if (saveBtn) {
    saveBtn.addEventListener('click', () => {
      if (modalCallback) modalCallback();
    });
  }
}

function closeModal(e) {
  if (e && e.target !== document.getElementById('modal-overlay')) return;
  document.getElementById('modal-overlay').style.display = 'none';
  modalCallback = null;
}

  '拙政园':'拙政园是苏州园林的代表作。明代御史王献臣罢官回乡，以大弘寺旧址建园，取"拙者之为政"之意。园中以水为中心，亭台楼阁临水而建，一步一景。文徵明曾为它画了31幅《拙政园图》。🌿 建议雨天去，雨中园林别有韵味。',
  '夫子庙':'南京夫子庙是祭祀孔子的地方，始建于宋代。门前的秦淮河自古就是繁华之地，"烟笼寒水月笼沙，夜泊秦淮近酒家"。明清时这里是全国最大的科举考场，可容纳2万考生。🏮 建议晚上来，秦淮灯影最是动人，顺便尝尝鸭血粉丝汤。',
  '大雁塔':'大雁塔是西安的标志。唐代玄奘法师从印度取经归来，为了存放带回来的657部佛经和佛像，奏请朝廷修建了这座塔。塔名取自印度"雁塔"的典故——传说大雁为救饥饿的僧人投身火中。🕌 建议傍晚来，广场上的音乐喷泉是亚洲最大。',
  '布达拉宫':'布达拉宫是世界上海拔最高的宫殿。7世纪藏王松赞干布为迎娶文成公主而建。"布达拉"是梵语音译，意为"普陀山"——观世音菩萨的道场。白宫是达赖喇嘛的居所，红宫是佛殿和灵塔殿。🏔️ 高原反应别轻视，建议到拉萨后休息一天再去。',
  '三亚':'三亚古称"崖州"，是中国最南端的城市。天涯海角的名字来自两块巨石——古人认为这里就是天地的尽头了。苏轼被贬海南时曾写下"日啖荔枝三百颗，不辞长作岭南人"。🏖️ 建议避开春节期间，酒店价格会翻好几倍。',
  '泰山':'泰山是"五岳独尊"，自秦始皇开始有72位帝王亲临封禅。杜甫的"会当凌绝顶，一览众山小"写尽了登顶的豪情。看日出是泰山的经典体验——凌晨4点出发，山顶等日出的人坐满石阶。🌄 建议夜爬，带手电筒和厚外套。',
  '华山':'华山以"险"闻名天下。"自古华山一条路"指的是从北峰到南峰的悬崖栈道。长空栈道建在绝壁之上，脚下就是万丈深渊——走一趟需要巨大勇气。华山也是道教圣地，陈抟老祖曾在此修炼。⛰️ 建议坐缆车到北峰再步行，省体力体验核心险道。',
  '西湖醋鱼':'西湖醋鱼是杭州第一名菜，据说源于南宋。宋嫂在西湖边卖鱼羹，宋高宗尝后赞不绝口，从此"宋嫂鱼羹"名扬天下。正宗做法用草鱼，以醋和糖调味，酸甜可口。🐟 楼外楼最有名，但本地人更推荐山外山或知味观。',
  '虎跑公园':'虎跑泉名列"天下第三泉"。唐代高僧性空禅师在此修行时梦到神人告知"二虎跑地出泉"，第二天果然有两只老虎刨地涌出清泉。济公曾在此修行，弘一法师李叔同也在此出家。🍵 用虎跑泉水泡龙井茶，被称为"西湖双绝"。',
  '雷峰塔':'雷峰塔因白娘子传说而家喻户晓。《白蛇传》中法海将白素贞镇压于雷峰塔下。历史上的雷峰塔是公元975年吴越国王为供奉佛螺髻发而建。1924年倒塌时，鲁迅还专门写了文章。2002年重建。🏯 登塔俯瞰西湖全景是最佳机位。',
  '千岛湖':'千岛湖其实是一个水库——1959年新安江水电站截流，1078座山峰变成了岛屿。水下还沉睡着两座千年古城：狮城和贺城。湖水能见度达7-12米，是国家一级水体。🏊 夏天是玩水季，可以划船、潜水、住湖景民宿。',
  '莫高窟':'莫高窟是沙漠中的艺术宝库。公元366年，乐僔和尚云游至此，见三危山金光闪耀如千佛显现，于是在崖壁上开凿了第一窟。此后千年间共开凿了735个洞窟。藏经洞的5万件经卷震惊了世界。🕌 建议提前预约，每天限流6000人。',
  '桂林':'"桂林山水甲天下"这句话刻在独秀峰的石壁上已有800多年。漓江两岸的山峰是典型的喀斯特地貌，是海底抬升后经亿万年溶蚀形成的。20元人民币背面的图案就是漓江黄布倒影。🚣 建议坐竹筏从杨堤到九马画山，是最精华的一段。',
  '洪崖洞':'洪崖洞是重庆的地标。过去这里是一片吊脚楼群，是江边纤夫和贫民的家。改造后变成11层的立体魔幻建筑——1楼是马路，11楼出去还是马路。夜景亮灯后酷似宫崎骏《千与千寻》的汤屋。🏮 建议晚上来，但人很多要注意安全。',
  '宽窄巷子':'宽窄巷子是成都少城仅存的历史街区。清康熙年间平定西域后，留下部分八旗兵驻守成都，修建了"满城"——也就是少城。宽巷子是"闲生活"的代表，窄巷子是"慢生活"的缩影。🍵 建议下午来，喝茶掏耳朵，体验成都慢生活。',
  '黄鹤楼':'黄鹤楼与岳阳楼、滕王阁并称"江南三大名楼"。传说曾有仙人骑黄鹤在此歇脚。崔颢的"昔人已乘黄鹤去，此地空余黄鹤楼"让李白都感叹"眼前有景道不得，崔颢题诗在上头"。现在的黄鹤楼是1985年重建的。🏯 登楼眺望长江大桥，江景壮阔。',
  '平遥古城':'平遥古城是中国保存最完整的古代县城。明清时期平遥是全国的金融中心——这里有中国第一票号"日升昌"，相当于今天的银行总部。古城墙、县衙、镖局、庙宇都保留完好。🏘️ 建议住一晚古城客栈，晚上打灯笼逛街最有意境。',
  '都江堰':'都江堰是世界水利工程的奇迹。公元前256年秦国蜀郡太守李冰父子主持修建，利用鱼嘴分水、飞沙堰溢洪、宝瓶口引水，灌溉成都平原两千多年。成都之所以成为"天府之国"，都江堰功不可没。🌊 亲眼看到江水被巧妙分流，会惊叹古人的智慧。',
};

function lookupAttractionStory(name) {
  if (!name) return null;
  // Try exact match
  for (const [key, story] of Object.entries(ATTRACTION_KB)) {
    if (name.includes(key) || key.includes(name)) return story;
  }
  return null;
}

function generateTemplateStory(name, type, destination) {
  const destStr = destination || '当地';
  const typeStr = type === 'food' ? '美食' : type === 'sightseeing' ? '景点' : '地点';
  const templates = [
    `「${name}」是${destStr}值得一去的${typeStr}。这里承载着当地独特的历史记忆与文化底蕴。漫步其间，一砖一瓦都在诉说过往的故事。📸 建议预留充足时间慢慢探索，你会发现每个角落都有惊喜。`,
    `来到${destStr}，不能错过「${name}」。这里以独特的魅力吸引着八方来客，是了解当地风情的最佳窗口。无论晴雨，都有不同的美丽。🌿 清晨人少时来访，能体会到最纯粹的氛围。`,
    `「${name}」隐藏在${destStr}的角落里，是一处还未被游客淹没的好地方。在这里你能遇见最真实的风土人情，感受到城市最朴素的温度。📝 建议出发前查好交通和开放时间。`,
    `据说每个到${destStr}的旅人，都会来「${name}」看一看。有人为风景而来，有人为故事驻足。无论你为何而来，这里总有一面让你流连。🔍 找到当地人问一问，会听到更生动的故事。`,
  ];
  return templates[Math.floor(Math.random() * templates.length)];
}

function selectTrip(id) {
  const data = loadData();
  data.activeTripId = id;
  saveData(data);
  switchTab('itinerary');
}

function getTotalBudget(trip) {
  let total = 0;
  if (trip.budget && trip.budget.categories) {
    Object.values(trip.budget.categories).forEach(c => { total += (c.budget || 0); });
  }
  return total;
}

function countActivities(trip) {
  let count = 0;
  if (trip.days) trip.days.forEach(d => { count += (d.activities || []).length; });
  return count;
}

function deleteTrip(id) {
  if (!confirm('确定要删除这个行程吗？此操作不可恢复。')) return;
  const data = loadData();
  data.trips = data.trips.filter(t => t.id !== id);
  if (data.activeTripId === id) {
    data.activeTripId = data.trips.length > 0 ? data.trips[0].id : null;
  }
  saveData(data);
  renderHome();
}

function showCreateTripModal(editTripId) {
  const data = loadData();
  let trip = null;
  if (editTripId) {
    trip = data.trips.find(t => t.id === editTripId);
  }

  const travelersStr = trip ? trip.travelers.join('、') : '我';

  openModal(
    trip ? '编辑行程' : '新建行程',
    `
      <div class="form-group">
        <label class="form-label">行程名称</label>
        <input class="form-input" id="mf-name" placeholder="如：端午杭州双人游" value="${trip ? escHtml(trip.name) : ''}">
      </div>
      <div class="form-group">
        <label class="form-label">目的地</label>
        <input class="form-input" id="mf-dest" placeholder="如：杭州" value="${trip ? escHtml(trip.destination) : ''}">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">开始日期</label>
          <input class="form-input" type="date" id="mf-start" value="${trip ? trip.startDate : ''}">
        </div>
        <div class="form-group">
          <label class="form-label">结束日期</label>
          <input class="form-input" type="date" id="mf-end" value="${trip ? trip.endDate : ''}">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">同行人员（用逗号分隔）</label>
        <input class="form-input" id="mf-travelers" placeholder="如：我,伴侣,小明" value="${travelersStr}">
        <div class="form-hint">用逗号分隔多个名字</div>
      </div>
      <button class="btn btn-primary btn-block mt-8 modal-save-btn">${trip ? '保存修改' : '创建行程'}</button>
    `,
    () => {
      const name = document.getElementById('mf-name').value.trim();
      const dest = document.getElementById('mf-dest').value.trim();
      const start = document.getElementById('mf-start').value;
      const end = document.getElementById('mf-end').value;
      const travelersRaw = document.getElementById('mf-travelers').value.trim();
      if (!name || !dest || !start || !end || !travelersRaw) {
        alert('请填写所有必填字段'); return;
      }
      if (new Date(end) < new Date(start)) { alert('结束日期不能早于开始日期'); return; }

      const travelers = travelersRaw.split(/[,，、]/).map(s => s.trim()).filter(Boolean);
      const data = loadData();

      if (trip) {
        // Edit existing
        const idx = data.trips.findIndex(t => t.id === trip.id);
        if (idx >= 0) {
          trip.name = name; trip.destination = dest;
          trip.startDate = start; trip.endDate = end;
          trip.travelers = travelers;
          // Fix days array to match date range
          syncDays(trip);
          data.trips[idx] = trip;
        }
      } else {
        // Create new
        const newTrip = {
          id: uuid(), name, destination: dest,
          startDate: start, endDate: end, travelers,
          createdAt: new Date().toISOString(),
          days: [], budget: {
            categories: {
              '交通': { budget: 0, actual: 0 },
              '住宿': { budget: 0, actual: 0 },
              '餐饮': { budget: 0, actual: 0 },
              '门票': { budget: 0, actual: 0 },
              '购物': { budget: 0, actual: 0 },
              '其他': { budget: 0, actual: 0 },
            }
          },
          packingList: [{ id: uuid(), text: '身份证', category: '证件', note: '必带', checked: false }],
          tips: []
        };
        syncDays(newTrip);
        data.trips.push(newTrip);
        data.activeTripId = newTrip.id;
      }
      saveData(data);
      closeModal();
      renderHome();
      // Re-render current view if needed
      const activePage = document.querySelector('.page.active');
      if (activePage && activePage.id === 'itinerary-page') renderItinerary();
    }
  );
}

function fmtLocalDate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function syncDays(trip) {
  const totalDays = getTripDays(trip);
  const startDate = trip.startDate;
  // Preserve existing days
  const existingDays = trip.days || [];
  const newDays = [];
  // Parse as local date (avoid UTC timezone shift from toISOString)
  const parts = startDate.split('-');
  const baseDate = new Date(+parts[0], +parts[1] - 1, +parts[2]);
  for (let i = 0; i < totalDays; i++) {
    const d = new Date(baseDate);
    d.setDate(d.getDate() + i);
    const dateStr = fmtLocalDate(d);
    const existing = existingDays.find(d2 => d2.date === dateStr);
    if (existing) {
      existing.dayNumber = i + 1;
      newDays.push(existing);
    } else {
      newDays.push({ dayNumber: i + 1, date: dateStr, activities: [] });
    }
  }
  trip.days = newDays;
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setupCountdown(trip) {
  const target = new Date(trip.startDate + 'T00:00:00').getTime();
  const dEl = document.getElementById('cd-d'), hEl = document.getElementById('cd-h');
  const mEl = document.getElementById('cd-m'), sEl = document.getElementById('cd-s');
  const msgEl = document.getElementById('cd-msg'), blocksEl = document.getElementById('cd-blocks');
  if (!dEl || !hEl || !mEl || !sEl) return;

  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) {
      if (blocksEl) blocksEl.style.display = 'none';
      if (msgEl) { msgEl.textContent = '旅途进行中，玩得开心！'; msgEl.classList.add('gone'); }
      return;
    }
    const d = Math.floor(diff / 864e5), h = Math.floor(diff % 864e5 / 36e5);
    const m = Math.floor(diff % 36e5 / 6e4), s = Math.floor(diff % 6e4 / 1e3);
    dEl.textContent = d; hEl.textContent = String(h).padStart(2, '0');
    mEl.textContent = String(m).padStart(2, '0'); sEl.textContent = String(s).padStart(2, '0');
    if (d === 0 && h === 0 && m < 30) msgEl.textContent = '马上出发！';
    else if (d === 0) msgEl.textContent = '今天出发！';
    else if (d === 1) msgEl.textContent = '明天出发，准备好了吗？';
    else msgEl.textContent = '距离出发';
    requestAnimationFrame(tick);
  }
  tick();
}

function renderDayCard(trip, day, dayIndex) {
  const dc = DAY_COLORS[dayIndex % DAY_COLORS.length];
  const total = day.activities.length;
  const done = day.activities.filter(a => a.done).length;
  const pct = total > 0 ? Math.round(done / total * 100) : 0;

  let actHtml = '';
  day.activities.forEach((a, actIdx) => {
    const hc = a.highlight ? ' highlight' : '';
    const dn = a.done ? ' done' : '';
    const typeLabel = TYPE_LABELS[a.type] || '📌 其他';
    actHtml += `
      <div class="tl-item${hc}${dn}" data-id="${a.id}" data-day="${day.dayNumber}" onclick="toggleActivityCheck('${a.id}', ${day.dayNumber})">
        <span class="tl-check"></span>
        <div class="tl-time">${escHtml(a.time)}</div>
        <div class="tl-title">${escHtml(a.title)}</div>
        ${a.description ? `<div class="tl-desc">${escHtml(a.description)}</div>` : ''}
        <span class="tl-type-tag ${a.type}">${typeLabel}</span>
        ${a.location ? `<span style="font-size:11px;color:#999;margin-left:4px">📍 ${escHtml(a.location.name)}</span>` : ''}
        <span class="inline-btn" style="margin-left:4px;background:#f0f0f0;color:#666;font-size:10px" onclick="event.stopPropagation();editActivity(${day.dayNumber},'${a.id}')">✏️</span>
        <span class="inline-btn" style="background:#fee;color:#e74c3c;font-size:10px" onclick="event.stopPropagation();deleteActivity(${day.dayNumber},'${a.id}')">×</span>
      </div>
    `;
    // Insert route card between consecutive activities that both have coordinates
    if (actIdx < day.activities.length - 1) {
      const nextAct = day.activities[actIdx + 1];
      const hasFrom = a.location && a.location.lat && a.location.lng;
      const hasTo = nextAct.location && nextAct.location.lat && nextAct.location.lng;
      if (hasFrom && hasTo) {
        actHtml += `
          <div class="route-card" id="route-${day.dayNumber}-${actIdx}" data-from-id="${a.id}" data-to-id="${nextAct.id}">
            <span class="route-icon">🛣️</span>
            <span class="route-info">
              <span class="route-mode">--</span>
              <span class="route-dist">--</span>
              <span class="route-time">--</span>
            </span>
            <button class="route-btn" onclick="event.stopPropagation();fetchAndDisplayRoute(${day.dayNumber},${actIdx},'${a.id}','${nextAct.id}')">查询路线</button>
            <span class="route-no-key" style="display:none">需要配置高德Key</span>
          </div>
        `;
      }
    }
  });

  return `
    <div class="card ${dc.css}" id="sec-d${day.dayNumber}">
      <div class="day-header">
        <div class="day-num">D${day.dayNumber}</div>
        <div class="day-info">
          <h2>${escHtml(trip.destination)} · ${getDayName(day.dayNumber)}</h2>
          <div class="date">${formatDate(day.date)}</div>
        </div>
      </div>
      <div class="progress-bar" id="prog-d${day.dayNumber}">
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span class="progress-text">${done}/${total}</span>
      </div>
      <div class="timeline">${actHtml}</div>
      <button class="add-btn mt-12" onclick="showAddActivityModal(${day.dayNumber})">+ 添加活动</button>
    </div>
  `;
}

function toggleActivityCheck(actId, dayNum) {
  const data = loadData();
  const trip = getActiveTrip();
  if (!trip) return;
  const day = trip.days.find(d => d.dayNumber === dayNum);
  if (!day) return;
  const act = day.activities.find(a => a.id === actId);
  if (!act) return;
  act.done = !act.done;
  // Update data
  const idx = data.trips.findIndex(t => t.id === trip.id);
  if (idx >= 0) data.trips[idx] = trip;
  saveData(data);
  // Update visual
  const el = document.querySelector(`.tl-item[data-id="${actId}"]`);
  if (el) {
    if (act.done) el.classList.add('done'); else el.classList.remove('done');
  }
  updateProgressBars();
}

function updateProgressBars() {
  const trip = getActiveTrip();
  if (!trip) return;
  trip.days.forEach(day => {
    const total = day.activities.length;
    const done = day.activities.filter(a => a.done).length;
    const pct = total > 0 ? Math.round(done / total * 100) : 0;
    const progEl = document.getElementById(`prog-d${day.dayNumber}`);
    if (progEl) {
      progEl.querySelector('.progress-fill').style.width = pct + '%';
      progEl.querySelector('.progress-text').textContent = done + '/' + total;
    }
  });
}

function editActivity(dayNum, actId) {
  const trip = getActiveTrip();
  if (!trip) return;
  const day = trip.days.find(d => d.dayNumber === dayNum);
  if (!day) return;
  const act = day.activities.find(a => a.id === actId);
  if (!act) return;
  showAddActivityModal(dayNum, act);
}

function deleteActivity(dayNum, actId) {
  if (!confirm('确定要删除这个活动吗？')) return;
  const data = loadData();
  const trip = data.trips.find(t => t.id === data.activeTripId);
  if (!trip) return;
  const day = trip.days.find(d => d.dayNumber === dayNum);
  if (!day) return;
  day.activities = day.activities.filter(a => a.id !== actId);
  const idx = data.trips.findIndex(t => t.id === trip.id);
  if (idx >= 0) data.trips[idx] = trip;
  saveData(data);
  renderItinerary();
}

function renderPackingList(trip) {
  if (!trip.packingList || trip.packingList.length === 0) {
    return `<button class="add-btn" onclick="addPackItem()">+ 添加打包清单</button>`;
  }
  // Group by category
  const groups = {};
  trip.packingList.forEach(item => {
    const cat = item.category || '其他';
    if (!groups[cat]) groups[cat] = [];
    groups[cat].push(item);
  });

  const total = trip.packingList.length;
  const checked = trip.packingList.filter(i => i.checked).length;
  const pct = total > 0 ? Math.round(checked / total * 100) : 0;

  let html = `<div class="card" style="background:linear-gradient(135deg,#e3f2fd,#ede7f6);border:1px solid rgba(100,149,237,.2)">
    <h3 style="font-size:14px;font-weight:600;margin-bottom:14px;color:#3949ab">🧳 打包清单</h3>
    <div class="progress-bar"><div class="progress-track"><div class="progress-fill" style="width:${pct}%;background:linear-gradient(90deg,#5c6bc0,#7c4dff)"></div></div><span class="progress-text">${checked}/${total}</span></div>`;

  Object.entries(groups).forEach(([cat, items]) => {
    html += `<div class="pack-section">
      <div class="pack-section-title">${cat}</div>`;
    items.forEach(item => {
      const ck = item.checked ? ' checked' : '';
      html += `
        <div class="pack-item${ck}" data-pk="${item.id}" onclick="togglePackItem('${item.id}')">
          <span class="pack-check"></span>
          <span class="pack-text">${escHtml(item.text)}</span>
          ${item.note ? `<span class="pack-note">${escHtml(item.note)}</span>` : ''}
          <span style="font-size:10px;color:#999;cursor:pointer;margin-left:4px" onclick="event.stopPropagation();deletePackItem('${item.id}')">×</span>
        </div>`;
    });
    html += `</div>`;
  });

  html += `<button class="add-btn mt-12" style="border-style:dashed" onclick="addPackItem()">+ 添加物品</button></div>`;
  return html;
}

function togglePackItem(itemId) {
  const data = loadData();
  const trip = data.trips.find(t => t.id === data.activeTripId);
  if (!trip) return;
  const item = (trip.packingList || []).find(i => i.id === itemId);
  if (!item) return;
  item.checked = !item.checked;
  const idx = data.trips.findIndex(t => t.id === trip.id);
  if (idx >= 0) data.trips[idx] = trip;
  saveData(data);
  // Update visual surgically
  const el = document.querySelector(`.pack-item[data-pk="${itemId}"]`);
  if (el) {
    if (item.checked) el.classList.add('checked'); else el.classList.remove('checked');
  }
  // Update progress bar in-place
  const total = trip.packingList.length;
  const chk = trip.packingList.filter(i => i.checked).length;
  const pct = total > 0 ? Math.round(chk / total * 100) : 0;
  const packProg = document.querySelector('.pack-item')?.closest('.card')?.querySelector('.progress-fill');
  const packText = document.querySelector('.pack-item')?.closest('.card')?.querySelector('.progress-text');
  if (packProg) packProg.style.width = pct + '%';
  if (packText) packText.textContent = chk + '/' + total;
}

function addPackItem() {
  openModal('添加物品', `
    <div class="form-group">
      <label class="form-label">物品名称</label>
      <input class="form-input" id="pk-text" placeholder="如：身份证">

function deletePackItem(itemId) {

  trip.packingList = (trip.packingList || []).filter(i => i.id !== itemId);

function renderCost() {
  const trip = getActiveTrip();
  const container = document.getElementById('cost-content');
  if (!trip) {
    container.innerHTML = `
      <div class="no-trip-selected">
        <div class="icon">💰</div><h3>请先选择行程</h3>
        <p>回到首页选择或创建一个旅行计划</p>
        <button class="btn btn-primary mt-16" onclick="switchTab('home')">去首页</button>
      </div>`;
    return;
  }

  // Trip selector
  const data = loadData();
  let selHtml = `<div class="trip-selector">
    <select onchange="selectTripForCost(this.value)">`;
  data.trips.forEach(t => {
    selHtml += `<option value="${t.id}" ${t.id === trip.id ? 'selected' : ''}>${t.name}</option>`;
  });
  selHtml += `</select></div>`;

  // Calculate totals
  const cats = trip.budget && trip.budget.categories ? trip.budget.categories : {};
  let totalBudget = 0, totalActual = 0;
  Object.values(cats).forEach(c => { totalBudget += (c.budget || 0); totalActual += (c.actual || 0); });
  const remaining = totalBudget - totalActual;
  const perPerson = trip.travelers.length > 0 ? Math.round(totalActual / trip.travelers.length) : 0;

  // Summary
  let html = selHtml + `
    <div class="cost-summary">
      <div class="cost-summary-item cs-budget">
        <div class="cost-summary-val">¥${totalBudget.toLocaleString()}</div>
        <div class="cost-summary-label">总预算</div>
      </div>
      <div class="cost-summary-item cs-spent">
        <div class="cost-summary-val">¥${totalActual.toLocaleString()}</div>
        <div class="cost-summary-label">已花费</div>
      </div>
      <div class="cost-summary-item cs-remain">
        <div class="cost-summary-val">¥${remaining.toLocaleString()}</div>
        <div class="cost-summary-label">剩余</div>
      </div>
      <div class="cost-summary-item cs-avg">
        <div class="cost-summary-val">¥${perPerson.toLocaleString()}</div>
        <div class="cost-summary-label">人均 / ${trip.travelers.length}人</div>
      </div>
    </div>
  `;

  // Budget categories
  html += `<div class="card"><div class="section-title">📊 预算分类</div>`;
  Object.entries(cats).forEach(([name, c]) => {
    const spent = c.actual || 0;
    const budget = c.budget || 0;
    const pct = budget > 0 ? Math.round(spent / budget * 100) : 0;
    const status = pct > 100 ? 'over' : (pct > 80 ? 'warn' : 'safe');
    html += `
      <div class="budget-category">
        <div class="bc-icon" style="background:${CAT_COLORS[name] || '#888'}20;color:${CAT_COLORS[name] || '#888'}">${CAT_ICONS[name] || '📌'}</div>
        <div class="bc-info">
          <div class="bc-name">${name}</div>
          <div class="bc-progress-wrap">
            <div class="bc-progress"><div class="bc-progress-fill ${status}" style="width:${Math.min(pct,100)}%"></div></div>
            <span class="bc-amount">¥${spent.toLocaleString()} / ¥${budget.toLocaleString()}</span>
          </div>
        </div>
        <button class="inline-btn" style="background:#f0f0f0;color:#666" onclick="editBudgetCat('${name}',${budget})">✏️</button>
      </div>`;
  });
  html += `</div>`;

  // Expense list
  html += `<div class="card">
    <div class="section-title">📝 支出记录</div>`;
  const expenses = collectExpenses(trip);
  if (expenses.length === 0) {
    html += `<p style="font-size:13px;color:#999;text-align:center;padding:16px">暂无支出记录</p>`;
  } else {
    expenses.forEach(exp => {
      html += `
        <div class="expense-item">
          <div class="expense-icon" style="background:${CAT_COLORS[exp.category] || '#888'}">${CAT_ICONS[exp.category] || '📌'}</div>
          <div class="expense-info">
            <div class="expense-title">${escHtml(exp.title)}</div>
            <div class="expense-meta">${exp.category} · ${exp.paidBy} · ${exp.date || ''}</div>
          </div>
          <div class="expense-amount">¥${exp.amount.toLocaleString()}</div>
          <button class="inline-btn" style="background:#fee;color:#e74c3c;font-size:10px;margin-left:4px" onclick="deleteExpense('${exp.id}')">×</button>
        </div>`;
    });
  }
  html += `<button class="btn btn-primary btn-block mt-12" onclick="showAddExpenseModal()">+ 记录支出</button></div>`;

  // Splitting
  if (trip.travelers.length > 1) {
    html += `<div class="card">
      <div class="section-title">👥 费用分摊</div>`;
    const splitData = calcSplit(trip);
    splitData.forEach(s => {
      html += `
        <div class="split-person">
          <span class="split-person-name">${escHtml(s.name)}</span>
          <span class="split-person-amount">¥${s.amount.toLocaleString()}</span>
        </div>`;
    });
    html += `</div>`;
  }

  // Pie chart
  if (totalActual > 0) {
    html += `<div class="card">
      <div class="section-title">📈 支出分布</div>
      <div class="chart-container"><canvas class="chart-canvas" id="cost-chart"></canvas></div>
      <div class="chart-legend" id="chart-legend"></div>
    </div>`;
  }

  container.innerHTML = html;

  // Draw chart
  if (totalActual > 0) setTimeout(drawCostChart, 100, cats);
}

function selectTripForCost(id) {
  const data = loadData();
  data.activeTripId = id;
  saveData(data);
  renderCost();
}

function editBudgetCat(name, currentBudget) {
  openModal(`编辑预算 - ${name}`, `
    <div class="form-group">
      <label class="form-label">预算金额 (¥)</label>
      <input class="form-input" type="number" id="bf-amount" value="${currentBudget}" min="0" step="100">
    </div>
    <button class="btn btn-primary btn-block modal-save-btn">保存</button>
  `, () => {
    const amount = parseInt(document.getElementById('bf-amount').value) || 0;
    const data = loadData();
    const trip = data.trips.find(t => t.id === data.activeTripId);
    if (!trip) return;
    if (!trip.budget) trip.budget = { categories: {} };
    if (!trip.budget.categories[name]) trip.budget.categories[name] = { budget: 0, actual: 0 };
    trip.budget.categories[name].budget = amount;
    const idx = data.trips.findIndex(t => t.id === trip.id);
    if (idx >= 0) data.trips[idx] = trip;
    saveData(data);
    closeModal();
    renderCost();
  });
}

function collectExpenses(trip) {
  // Collect expenses from budget categories actual tracking
  // Also from individual activity costs if any
  const expenses = [];
  // For now, we'll have a flat expense list stored in the trip
  if (trip.expenses) {
    trip.expenses.forEach(e => expenses.push(e));
  }
  return expenses;
}

function showAddExpenseModal(editExp) {
  const trip = getActiveTrip();
  if (!trip) return;
  const cats = Object.keys(trip.budget?.categories || { '交通':{},'住宿':{},'餐饮':{},'门票':{},'购物':{},'其他':{} });

  openModal(editExp ? '编辑支出' : '记录支出', `
    <div class="form-group">
      <label class="form-label">项目名称</label>
      <input class="form-input" id="ef-title" placeholder="如：动车票" value="${editExp ? escHtml(editExp.title) : ''}">
    </div>
    <div class="form-group">
      <label class="form-label">金额 (¥)</label>
      <input class="form-input" type="number" id="ef-amount" placeholder="0" value="${editExp ? editExp.amount : ''}" min="0">
    </div>
    <div class="form-group">
      <label class="form-label">类别</label>
      <select class="form-select" id="ef-cat">
        ${cats.map(c => `<option value="${c}" ${editExp && editExp.category === c ? 'selected' : ''}>${CAT_ICONS[c]||''} ${c}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">付款人</label>
      <select class="form-select" id="ef-payer">
        ${trip.travelers.map(t => `<option value="${t}" ${editExp && editExp.paidBy === t ? 'selected' : ''}>${t}</option>`).join('')}
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input class="form-input" type="date" id="ef-date" value="${editExp ? (editExp.date || '') : trip.startDate}">
    </div>
    <button class="btn btn-primary btn-block modal-save-btn">${editExp ? '保存' : '记录'}</button>
  `, () => {
    const title = document.getElementById('ef-title').value.trim();
    const amount = parseInt(document.getElementById('ef-amount').value) || 0;
    const category = document.getElementById('ef-cat').value;
    const paidBy = document.getElementById('ef-payer').value;
    const date = document.getElementById('ef-date').value;
    if (!title || amount <= 0) { alert('请填写项目名称和金额'); return; }

    const data = loadData();
    const trip = data.trips.find(t => t.id === data.activeTripId);
    if (!trip) return;
    if (!trip.expenses) trip.expenses = [];

    if (editExp) {
      const idx = trip.expenses.findIndex(e => e.id === editExp.id);
      if (idx >= 0) {
        // Adjust category actuals
        const oldCat = trip.expenses[idx].category;
        const oldAmount = trip.expenses[idx].amount;
        if (trip.budget?.categories?.[oldCat]) trip.budget.categories[oldCat].actual -= oldAmount;
        trip.expenses[idx] = { id: editExp.id, title, amount, category, paidBy, date };
        if (trip.budget?.categories?.[category]) trip.budget.categories[category].actual += amount;
      }
    } else {
      const exp = { id: uuid(), title, amount, category, paidBy, date };
      trip.expenses.push(exp);
      // Update category actual
      if (trip.budget && trip.budget.categories && trip.budget.categories[category]) {
        trip.budget.categories[category].actual = (trip.budget.categories[category].actual || 0) + amount;
      }
    }

    const idx = data.trips.findIndex(t => t.id === trip.id);
    if (idx >= 0) data.trips[idx] = trip;
    saveData(data);
    closeModal();
    renderCost();
  });
}

function deleteExpense(expId) {
  if (!confirm('确定删除这条支出吗？')) return;
  const data = loadData();
  const trip = data.trips.find(t => t.id === data.activeTripId);
  if (!trip || !trip.expenses) return;
  const exp = trip.expenses.find(e => e.id === expId);
  if (exp && trip.budget?.categories?.[exp.category]) {
    trip.budget.categories[exp.category].actual = Math.max(0, (trip.budget.categories[exp.category].actual || 0) - exp.amount);
  }
  trip.expenses = trip.expenses.filter(e => e.id !== expId);
  const idx = data.trips.findIndex(t => t.id === trip.id);
  if (idx >= 0) data.trips[idx] = trip;
  saveData(data);
  renderCost();
}

function calcSplit(trip) {
  const totals = {};
  trip.travelers.forEach(t => { totals[t] = 0; });
  if (trip.expenses) {
    trip.expenses.forEach(e => {
      if (totals[e.paidBy] !== undefined) totals[e.paidBy] += e.amount;
    });
  }
  const totalSpent = Object.values(totals).reduce((a, b) => a + b, 0);
  const perPerson = trip.travelers.length > 0 ? Math.round(totalSpent / trip.travelers.length) : 0;
  return trip.travelers.map(name => ({
    name,
    amount: totals[name] || 0,
    diff: (totals[name] || 0) - perPerson
  }));
}

function generateMDContent(trip) {
  const dest = trip.destination || '未知';
  const dates = `${formatDate(trip.startDate)} ~ ${formatDate(trip.endDate)}`;
  const travelers = (trip.travelers || []).join('、') || '未设置';
  const now = new Date().toLocaleDateString('zh-CN');

  let md = `# ${trip.name}\n\n`;
  md += `**目的地**: ${dest} | **时间**: ${dates} | **同行**: ${travelers}\n\n`;
  md += `---\n\n## 📋 行程安排\n\n`;

  (trip.days || []).forEach(day => {
    md += `### Day ${day.dayNumber}: ${formatDate(day.date)}\n\n`;
    md += `| 时间 | 活动 | 类型 | 地点 | 备注 |\n`;
    md += `|------|------|------|------|------|\n`;
    (day.activities || []).forEach(a => {
      const loc = a.location?.name || '--';
      const desc = (a.description || '').replace(/\|/g, '&vert;');
      const typeLabel = (TYPE_LABELS[a.type] || a.type).replace(/\|/g, '&vert;');
      md += `| ${a.time} | ${a.title} | ${typeLabel} | ${loc} | ${desc} |\n`;
    });
    md += `\n`;
  });

  md += `---\n\n## 💰 预算概览\n\n`;
  md += `| 类别 | 预算 | 实际花费 |\n`;
  md += `|------|------|----------|\n`;
  let totalBudget = 0, totalActual = 0;
  if (trip.budget?.categories) {
    Object.entries(trip.budget.categories).forEach(([cat, v]) => {
      md += `| ${cat} | ¥${v.budget || 0} | ¥${v.actual || 0} |\n`;
      totalBudget += (v.budget || 0);
      totalActual += (v.actual || 0);
    });
  }
  md += `\n**总预算**: ¥${totalBudget} | **总花费**: ¥${totalActual} | **人均**: ¥${trip.travelers?.length ? Math.round(totalActual / trip.travelers.length) : 0}\n\n`;

  if (trip.tips && trip.tips.length > 0) {
    md += `---\n\n## 💡 出行贴士\n\n`;
    trip.tips.forEach(t => { md += `- ${t}\n`; });
    md += `\n`;
  }

  if (trip.packingList && trip.packingList.length > 0) {
    md += `---\n\n## 🎒 打包清单\n\n`;
    trip.packingList.forEach(item => {
      md += `- [${item.checked ? 'x' : ' '}] ${item.text}${item.note ? ' — ' + item.note : ''}\n`;
    });
    md += `\n`;
  }

  md += `---\n\n> 由旅行助手生成 · ${now}\n`;
  return md;
}

function generateCSVContent(trip) {
  let csv = '﻿'; // BOM for Excel UTF-8 compatibility

  // Schedule section
  csv += '日期,天数,时间,活动名称,描述,类型,地点\n';
  (trip.days || []).forEach(day => {
    (day.activities || []).forEach(a => {
      const esc = s => s ? '"' + String(s).replace(/"/g, '""') + '"' : '';
      csv += `${esc(day.date)},D${day.dayNumber},${esc(a.time)},${esc(a.title)},${esc(a.description || '')},${esc(TYPE_LABELS[a.type] || a.type)},${esc(a.location?.name || '')}\n`;
    });
  });

  // Expense section
  csv += '\n类别,项目,金额,付款人,日期\n';
  if (trip.expenses) {
    trip.expenses.forEach(e => {
      const esc = s => s ? '"' + String(s).replace(/"/g, '""') + '"' : '';
      csv += `${esc(e.category)},${esc(e.title)},${e.amount},${esc(e.paidBy)},${esc(e.date)}\n`;
    });
  }

  return csv;
}

function downloadBlob(content, filename, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportMarkdown(tripId) {
  const trip = loadData().trips.find(t => t.id === tripId);
  if (!trip) return;
  const content = generateMDContent(trip);
  downloadBlob(content, `${trip.name}.md`, 'text/markdown;charset=utf-8');
}

function exportCSV(tripId) {
  const trip = loadData().trips.find(t => t.id === tripId);
  if (!trip) return;
  const content = generateCSVContent(trip);
  downloadBlob(content, `${trip.name}.csv`, 'text/csv;charset=utf-8');
}

function drawCostChart(cats) {
  const canvas = document.getElementById('cost-chart');
  if (!canvas) return;
  const size = 260;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr;
  canvas.height = size * dpr;
  canvas.style.width = size + 'px';
  canvas.style.height = size + 'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const entries = Object.entries(cats).filter(([,c]) => (c.actual || 0) > 0);
  if (entries.length === 0) {
    ctx.fillStyle = '#ccc';
    ctx.font = '14px "Noto Sans SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无支出数据', size/2, size/2);
    return;
  }

  const total = entries.reduce((s, [,c]) => s + (c.actual || 0), 0);
  const colors = ['#e07a5f','#3d85c6','#9b5de5','#52b788','#f4a261','#6c757d'];
  const cx = size / 2, cy = size / 2;
  const outerR = 95, innerR = 55; // Donut

  // Draw donut slices
  let startAngle = -Math.PI / 2;
  entries.forEach(([,c], i) => {
    const sliceAngle = ((c.actual || 0) / total) * Math.PI * 2;
    const endAngle = startAngle + sliceAngle;

    // Draw slice
    ctx.beginPath();
    ctx.arc(cx, cy, outerR, startAngle, endAngle);
    ctx.arc(cx, cy, innerR, endAngle, startAngle, true);
    ctx.closePath();
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();

    // White border between slices
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Draw label on slice (only if slice is big enough)
    if (sliceAngle > 0.25) {
      const midAngle = startAngle + sliceAngle / 2;
      const labelR = (outerR + innerR) / 2;
      const lx = cx + Math.cos(midAngle) * labelR;
      const ly = cy + Math.sin(midAngle) * labelR;
      const pct = Math.round((c.actual || 0) / total * 100);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 12px "Noto Sans SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      if (pct >= 8) {
        ctx.fillText(pct + '%', lx, ly);
      }
    }
    startAngle = endAngle;
  });

  // Center text - total amount
  ctx.fillStyle = '#333';
  ctx.font = 'bold 18px "Noto Serif SC", serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const totalStr = '¥' + total.toLocaleString();
  // Split if too long
  if (totalStr.length > 7) {
    ctx.font = 'bold 15px "Noto Serif SC", serif';
  }
  ctx.fillText(totalStr, cx, cy - 6);
  ctx.fillStyle = '#999';
  ctx.font = '11px "Noto Sans SC", sans-serif';
  ctx.fillText('总支出', cx, cy + 16);

  // Legend
  const legendEl = document.getElementById('chart-legend');
  if (legendEl) {
    legendEl.innerHTML = entries.map(([name, c], i) => {
      const pct = Math.round((c.actual || 0) / total * 100);
      return `<div class="chart-legend-item">
        <span class="chart-legend-dot" style="background:${colors[i % colors.length]}"></span>
        ${name} <span class="chart-legend-pct">${pct}%</span> ¥${(c.actual||0).toLocaleString()}
      </div>`;
    }).join('');
  }
}

let mapInitialized = false, map = null;

function renderMap() {
  const trip = getActiveTrip();
  if (!trip) {
    document.getElementById('map-page').innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;flex-direction:column;color:#999;font-family:inherit">
        <div style="font-size:64px">🗺️</div>
        <p style="margin-top:12px">请先在首页选择行程</p>
        <button class="btn btn-primary mt-8" onclick="switchTab('home')">去首页</button>
      </div>`;
    return;
  }
  // Restore map container
  const mapPage = document.getElementById('map-page');
  if (!mapPage.querySelector('#map')) {
    mapPage.innerHTML = '<div id="map"></div>';
  }
  if (!mapInitialized) {
    mapInitialized = true;
    setTimeout(initMap, 100);
  } else {
    setTimeout(() => { map && map.invalidateSize(); refreshMapMarkers(); }, 100);
  }
}

function initMap() {
  map = L.map('map', { center: [30.1, 120.0], zoom: 10, zoomControl: false });
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
    subdomains: ['1','2','3','4'],
    attribution: '&copy; 高德地图',
    maxZoom: 18
  }).addTo(map);
  refreshMapMarkers();
}

let _markers = [], _routes = [];

function refreshMapMarkers() {
  if (!map) return;
  const trip = getActiveTrip();
  if (!trip) return;
  // Clear old
  _markers.forEach(m => map.removeLayer(m));
  _routes.forEach(r => map.removeLayer(r));
  _markers = []; _routes = []; clearRoutePolylines();

  // Check for existing controls
  const oldBtns = document.querySelector('.map-btns');
  if (oldBtns) oldBtns.remove();

  // Add filter buttons
  const btnDiv = L.DomUtil.create('div', 'map-btns');
  btnDiv.innerHTML = `<button class="map-btn d0 active" data-day="all">全程</button>` +
    trip.days.map((d, i) => `<button class="map-btn d${i+1}" data-day="${d.dayNumber}">D${d.dayNumber}</button>`).join('');
  document.getElementById('map-page').appendChild(btnDiv);
  btnDiv.querySelectorAll('.map-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      btnDiv.querySelectorAll('.map-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      filterMapMarkers(this.dataset.day);
    });
  });

  const typeColors = {
    transport: '#888', food: '#e07a5f', sightseeing: '#3d85c6',
    hotel: '#9b5de5', shopping: '#ff6b6b', other: '#6c757d'
  };

  const dayGroups = {};
  trip.days.forEach(day => {
    dayGroups[day.dayNumber] = { markers: [], points: [] };
    day.activities.forEach(a => {
      if (!a.location || !a.location.lat || !a.location.lng) return;
      const color = typeColors[a.type] || '#888';
      const icon = L.divIcon({
        className: '',
        html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>`,
        iconSize: [14, 14], iconAnchor: [7, 7], popupAnchor: [0, -10]
      });
      const popupHtml = `<div class="popup-title">${escHtml(a.title)}</div>
        <span class="popup-tag" style="background:${color}">${TYPE_LABELS[a.type]||a.type}</span>
        ${a.description ? `<div class="popup-desc">${escHtml(a.description)}</div>` : ''}`;
      const m = L.marker([a.location.lat, a.location.lng], { icon }).bindPopup(popupHtml);
      m._day = day.dayNumber;
      m.addTo(map);
      _markers.push(m);
      dayGroups[day.dayNumber].markers.push(m);
      dayGroups[day.dayNumber].points.push([a.location.lat, a.location.lng]);
    });
  });

  // Routes
  Object.values(dayGroups).forEach(g => {
    if (g.points.length >= 2) {
      const dc = DAY_COLORS[Object.keys(dayGroups).indexOf(String(g.markers[0]?._day || 1)) % DAY_COLORS.length];
      const r = L.polyline(g.points, { color: dc.dotColor, weight: 3, opacity: .6, dashArray: '8 6' });
      r._day = g.markers[0]?._day;
      r.addTo(map);
      _routes.push(r);
    }
  });

  // Fit bounds
  const allPoints = Object.values(dayGroups).flatMap(g => g.points);
  if (allPoints.length > 0) {
    map.fitBounds(L.latLngBounds(allPoints).pad(0.15));
  }

  // Legend
  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = function() {
    const d = L.DomUtil.create('div', 'map-legend');
    d.innerHTML = `<h4>图例</h4>` +
      Object.entries(typeColors).map(([k, v]) => `<div class="legend-item"><span class="legend-dot" style="background:${v}"></span> ${TYPE_LABELS[k]||k}</div>`).join('');
    return d;
  };
  // Check if legend already exists
  let hasLegend = false;
  map.eachLayer(l => { if (l.options && l.options.position === 'bottomleft') hasLegend = true; });
  if (!hasLegend) legend.addTo(map);

  // Draw cached route polylines
  Object.entries(_routeData).forEach(([key, data]) => {
    if (data.polyline) {
      drawRoutePolyline(data.dayNum, parseInt(key.split('-')[1]) || 0, data.polyline, data.mode);
    }
  });

  // Add route toggle bar if there are routes
  const oldRouteBar = document.querySelector('.route-toggle-bar');
  if (oldRouteBar) oldRouteBar.remove();
  if (Object.keys(_routeData).length > 0) {
    const routeBar = L.DomUtil.create('div', 'route-toggle-bar map-btns');
    const daySet = new Set();
    Object.values(_routeData).forEach(d => daySet.add(d.dayNum));
    routeBar.innerHTML = '<span style="font-size:10px;color:#888;margin-right:4px">🛣️ 路线:</span>' +
      '<button class="map-btn d0 active" data-route-day="all">全部</button>' +
      Array.from(daySet).sort().map(d =>
        `<button class="map-btn" data-route-day="${d}">D${d}</button>`
      ).join('');
    document.getElementById('map-page').appendChild(routeBar);
    routeBar.querySelectorAll('.map-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        routeBar.querySelectorAll('.map-btn').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        const d = this.dataset.routeDay;
        _routePolylines.forEach(r => {
          if (d === 'all' || r._day === parseInt(d)) {
            if (!map.hasLayer(r)) r.addTo(map);
          } else {
            map.removeLayer(r);
          }
        });
      });
    });
  }
}

function filterMapMarkers(day) {
  const showAll = day === 'all';
  _markers.forEach(m => {
    if (showAll || m._day === parseInt(day)) {
      if (!map.hasLayer(m)) m.addTo(map);
    } else {
      map.removeLayer(m);
    }
  });
  _routes.forEach(r => {
    if (showAll || r._day === parseInt(day)) {
      if (!map.hasLayer(r)) r.addTo(map);
    } else {
      map.removeLayer(r);
    }
  });
  _routePolylines.forEach(r => {
    if (showAll || r._day === parseInt(day)) {
      if (!map.hasLayer(r)) r.addTo(map);
    } else {
      map.removeLayer(r);
    }
  });
}
